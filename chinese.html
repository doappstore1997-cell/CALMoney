<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ຮຽນພາສາຈີນ ມ່ວນໆ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Phetsarath OT';
    src: local('Phetsarath OT'), local('Phetsarath_OT'), local('Phetsarath'),
         url('https://cdn.jsdelivr.net/gh/lao-dictionary/lao-fonts@master/Phetsarath_OT.ttf') format('truetype');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  :root {
    --bg: #FFF8EE; --card: #FFFFFF;
    --purple: #7C6FCD; --purple-light: #EEE9FF;
    --green: #5BAD6F; --green-light: #E6F7EA;
    --red: #E85D5D; --red-light: #FDEAEA;
    --blue: #4FA3E0; --blue-light: #E0F0FF;
    --yellow: #F9C74F;
    --text: #3A2E5A; --text-soft: #7B6F9A;
    --border: #E8DFF8;
    --shadow: 0 4px 16px rgba(232,93,93,0.13);
    --radius: 20px; --radius-lg: 28px;
    --cn: #D63A3A; --cn-light: #FFE4E4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
    background: var(--bg); min-height: 100vh;
    background-image:
      radial-gradient(circle at 10% 20%, #FFE0E0 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, #FFEFB8 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, #FFF5E5 0%, transparent 60%);
  }
  .app {
    max-width: 600px; margin: 0 auto;
    padding: clamp(10px,3vw,20px);
    min-height: 100vh; display: flex; flex-direction: column;
    gap: clamp(10px,2.5vw,16px); position: relative;
  }
  .sound-btn {
    position: absolute;
    top: clamp(10px,3vw,20px); right: clamp(10px,3vw,20px);
    width: clamp(38px,9vw,44px); height: clamp(38px,9vw,44px);
    border-radius: 50%; border: 2.5px solid var(--border);
    background: var(--card); color: var(--text);
    font-size: clamp(15px,4vw,20px); cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    z-index: 10; transition: all 0.15s;
    font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
    display: flex; align-items: center; justify-content: center;
    line-height: 1; padding: 0;
  }
  .sound-btn:active { transform: scale(0.9); }
  .sound-btn.muted { background: #FDEAEA; border-color: var(--red); opacity: 0.85; }

  .menu-btn {
    position: absolute;
    top: clamp(10px,3vw,20px); left: clamp(10px,3vw,20px);
    width: clamp(38px,9vw,44px); height: clamp(38px,9vw,44px);
    border-radius: 50%; border: 2.5px solid var(--border);
    background: var(--card); color: var(--cn);
    font-size: clamp(18px,5vw,24px); cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    z-index: 30; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
    line-height: 1; padding: 0; font-weight: 900;
  }
  .menu-btn:active { transform: scale(0.9); }
  .menu-btn.open { background: var(--cn); color: #fff; border-color: var(--cn); }

  .menu-overlay {
    position: fixed; inset: 0;
    background: rgba(58,46,90,0.45);
    z-index: 50; display: none;
    backdrop-filter: blur(3px);
  }
  .menu-overlay.show { display: block; animation: fade-in 0.18s; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .menu-panel {
    position: fixed;
    top: clamp(62px,14vw,76px); left: clamp(10px,3vw,20px);
    background: var(--card); border: 2.5px solid var(--cn);
    border-radius: var(--radius-lg);
    box-shadow: 0 10px 30px rgba(58,46,90,0.28);
    padding: clamp(10px,2.5vw,14px);
    z-index: 60; display: none;
    min-width: clamp(220px,60vw,280px);
    animation: slide-down 0.22s ease-out;
  }
  .menu-panel.show { display: block; }
  @keyframes slide-down {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .menu-title {
    font-size: clamp(13px,3.4vw,15px); font-weight: 900;
    color: var(--cn); text-align: center;
    padding: 4px 0 8px; border-bottom: 2px dashed var(--border);
    margin-bottom: 8px;
  }
  .menu-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: clamp(10px,2.5vw,14px);
    margin-bottom: 6px;
    border: 2px solid var(--border); border-radius: var(--radius);
    background: var(--card); color: var(--text);
    font-size: clamp(14px,3.6vw,16px); font-weight: 800;
    cursor: pointer; text-align: left;
    font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
    transition: all 0.15s; text-decoration: none;
  }
  .menu-item:last-child { margin-bottom: 0; }
  .menu-item:hover { background: var(--cn-light); border-color: var(--cn); }
  .menu-item:active { transform: scale(0.97); }
  .menu-item.current {
    background: var(--cn-light); border-color: var(--cn);
    color: var(--cn); cursor: default;
  }
  .menu-item.current::after { content: ' ✓'; margin-left: auto; font-weight: 900; }
  .menu-item .menu-ico {
    font-size: clamp(20px,5vw,24px); line-height: 1;
    width: clamp(34px,8vw,40px); height: clamp(34px,8vw,40px);
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; flex-shrink: 0;
  }
  .menu-item.mi-en .menu-ico { background: var(--blue-light); }
  .menu-item.mi-math .menu-ico { background: var(--purple-light); }
  .menu-item.mi-cn .menu-ico { background: var(--cn-light); }
  .menu-item.mi-lo .menu-ico { background: #FFF4D6; }
  .menu-item.mi-co .menu-ico { background: #FFEEDD; }

  .header { text-align: center; padding: clamp(6px,2vw,14px) 0 2px; }
  .header-icon { font-size: clamp(36px,10vw,56px); display: block; margin-bottom: 4px; animation: bounce 2s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .header-title { font-size: clamp(22px,6.5vw,34px); font-weight: 900; color: var(--cn); }
  .header-sub { font-size: clamp(11px,3vw,14px); color: var(--text-soft); font-weight: 600; }

  .topic-tabs {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: clamp(6px,1.8vw,10px);
  }
  .topic-btn {
    padding: clamp(9px,2.4vw,14px) 6px;
    border: 2.5px solid var(--border); border-radius: var(--radius);
    background: var(--card); color: var(--text-soft);
    font-size: clamp(11px,3vw,14px); font-weight: 800;
    cursor: pointer; text-align: center; transition: all 0.18s;
    font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
    line-height: 1.25;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .topic-btn .topic-ico { font-size: clamp(18px,5vw,26px); display: block; line-height: 1; }
  .topic-btn:active { transform: scale(0.95); }
  .topic-btn.active {
    background: var(--cn-light); border-color: var(--cn); color: var(--cn);
    transform: translateY(-2px); box-shadow: 0 4px 12px rgba(214,58,58,0.22);
  }

  .topic-title-bar {
    background: var(--card); border-radius: var(--radius);
    padding: clamp(10px,2.6vw,14px) clamp(14px,3vw,20px);
    box-shadow: var(--shadow); border: 2px solid var(--border);
    display: flex; align-items: center; gap: 10px; justify-content: center;
  }
  .topic-title-bar .tt-ico { font-size: clamp(22px,5.5vw,30px); line-height: 1; }
  .topic-title-bar .tt-text {
    font-size: clamp(15px,4vw,19px); font-weight: 900; color: var(--cn);
  }
  .topic-title-bar .tt-sub {
    font-size: clamp(11px,2.8vw,13px); color: var(--text-soft); font-weight: 700;
    margin-left: 6px;
  }

  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(95px,24vw,120px), 1fr));
    gap: clamp(8px,2vw,12px);
  }
  .item-card {
    background: var(--card); border: 3px solid var(--border);
    border-radius: var(--radius); padding: clamp(10px,2.5vw,14px) 6px;
    text-align: center; cursor: pointer;
    transition: all 0.18s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.06);
    font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; min-height: clamp(130px,32vw,160px);
    user-select: none; position: relative; overflow: hidden;
  }
  .item-card::before {
    content: '🔊'; position: absolute;
    top: 6px; right: 8px; font-size: clamp(11px,2.8vw,14px);
    opacity: 0.5;
  }
  .item-card:active { transform: scale(0.95) translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.06); }
  .item-card:hover { border-color: var(--cn); background: var(--cn-light); }
  .item-card.speaking {
    background: var(--cn); border-color: var(--cn); color: #fff;
    transform: scale(1.05);
    box-shadow: 0 4px 14px rgba(214,58,58,0.4), 0 0 0 4px rgba(214,58,58,0.25);
    animation: pulse-card 0.9s ease-in-out infinite;
  }
  .item-card.speaking::before { color: #fff; opacity: 1; }
  .item-card.speaking .item-pinyin,
  .item-card.speaking .item-lao { color: rgba(255,255,255,0.9); }
  @keyframes pulse-card {
    0%, 100% { transform: scale(1.04); }
    50%      { transform: scale(1.10); }
  }
  .item-emoji { font-size: clamp(26px,7vw,38px); line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15)); }
  .item-cn {
    font-size: clamp(20px,5.5vw,28px); font-weight: 900;
    color: inherit; line-height: 1.1;
    font-family: 'Noto Sans SC', 'Phetsarath OT', sans-serif;
  }
  .item-card.speaking .item-cn { color: #fff; }
  .item-pinyin {
    font-size: clamp(11px,3vw,14px); font-weight: 800;
    color: var(--cn); line-height: 1.1;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-style: italic;
  }
  .item-lao {
    font-size: clamp(10px,2.6vw,12px); color: var(--text-soft); font-weight: 700;
    line-height: 1.1;
  }

  .info-tip {
    text-align: center; font-size: clamp(11px,3vw,13px);
    color: var(--text-soft); font-weight: 700;
    background: var(--card); border-radius: var(--radius);
    padding: clamp(8px,2vw,12px); border: 2px dashed var(--border);
  }


  /* Pinyin items - big pinyin display */
  .item-card.pinyin .item-emoji {
    font-size: clamp(36px,9vw,52px);
    font-weight: 900;
    color: var(--cn);
    font-family: 'Segoe UI', system-ui, sans-serif;
    margin-bottom: 4px;
  }
  .item-card.pinyin.speaking .item-emoji { color: #fff; }
  .item-card.pinyin .item-cn {
    font-size: clamp(15px,4vw,20px);
    font-family: 'Noto Sans SC', sans-serif;
  }
  .item-card.pinyin {
    min-height: clamp(140px,34vw,170px);
  }
  @media (max-width: 360px) {
    .topic-tabs { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

<script>
var soundOn = true;
function toggleSound(){
  soundOn = !soundOn;
  var btn = document.getElementById('sound-btn');
  if(soundOn){ btn.textContent = '🔊'; btn.classList.remove('muted'); }
  else { btn.textContent = '🔇'; btn.classList.add('muted'); window.speechSynthesis.cancel(); }
}

function toggleMenu(e){
  if(e) e.stopPropagation();
  var panel = document.getElementById('menu-panel');
  if(panel.classList.contains('show')){ closeMenu(); } else { openMenu(); }
}
function openMenu(){
  document.getElementById('menu-btn').classList.add('open');
  document.getElementById('menu-panel').classList.add('show');
  document.getElementById('menu-overlay').classList.add('show');
}
function closeMenu(){
  document.getElementById('menu-btn').classList.remove('open');
  document.getElementById('menu-panel').classList.remove('show');
  document.getElementById('menu-overlay').classList.remove('show');
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeMenu();
});

/* === TTS - ປັບສຳລັບເດັກນ້ອຍຮຽນພາສາຈີນ ຊ້າ + ຄົມ === */
var voicesReady = false;
function loadVoices(){
  var v = window.speechSynthesis.getVoices();
  voicesReady = v && v.length > 0;
}
if('speechSynthesis' in window){
  try{ window.speechSynthesis.getVoices(); }catch(e){}
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 500);
  setTimeout(loadVoices, 1500);
}

function pickBestVoice(lang){
  var voices = window.speechSynthesis.getVoices() || [];
  if(!voices.length) return null;
  var langPrefix = lang.toLowerCase().substr(0,2);
  var candidates = voices.filter(function(v){
    return v.lang && v.lang.toLowerCase().substr(0,2) === langPrefix;
  });
  if(!candidates.length) return null;
  function score(v){
    var s = 0;
    var name = (v.name||'').toLowerCase();
    var vlang = (v.lang||'').toLowerCase();
    if(vlang === lang.toLowerCase()) s += 100;
    // ສຳລັບພາສາຈີນ ໃຫ້ priority zh-CN ສູງສຸດ (ຈີນກາງ)
    if(langPrefix === 'zh'){
      if(vlang === 'zh-cn' || vlang === 'zh_cn') s += 80;
      else if(vlang.indexOf('zh-cn')>=0) s += 60;
      else if(vlang.indexOf('zh-tw')>=0) s += 20;
    }
    if(name.indexOf('natural')>=0) s += 50;
    if(name.indexOf('neural')>=0) s += 50;
    if(name.indexOf('premium')>=0) s += 45;
    if(name.indexOf('enhanced')>=0) s += 40;
    if(name.indexOf('online')>=0) s += 30;
    if(name.indexOf('google')>=0) s += 35;
    if(name.indexOf('microsoft')>=0) s += 30;
    if(name.indexOf('apple')>=0) s += 25;
    if(name.indexOf('female')>=0) s += 15;
    if(name.indexOf('woman')>=0) s += 15;
    // ຊື່ສຽງຜູ້ຍິງພາສາຈີນທີ່ຮູ້ຈັກ
    if(/(tingting|yating|sin-?ji|huihui|hanhan|xiaoxiao|xiaoyi|tracy|li-?mu|mei-?jia|yaoyao|kangkang)/i.test(v.name||'')) s += 12;
    if(/(samantha|karen|zira|aria|jenny|emma)/i.test(v.name||'')) s += 6;
    if(v.default) s += 3;
    return s;
  }
  candidates.sort(function(a,b){ return score(b) - score(a); });
  return candidates[0];
}

/* ດຶງເອົາສະເພາະຕົວອັກສອນຈີນ ຈາກຂໍ້ຄວາມ (ສຳລັບໃຫ້ TTS ອ່ານຊັດເຈນ) */
function extractChinese(text){
  if(!text) return text;
  var m = text.match(/[\u4e00-\u9fff]+/);
  return m ? m[0] : text;
}

var currentSpeakingEl = null;
function speak(text, lang, el){
  if(!soundOn) return;
  if(!('speechSynthesis' in window)) return;
  var voices = window.speechSynthesis.getVoices();
  if(!voices.length){
    setTimeout(function(){ speak(text, lang, el); }, 250);
    return;
  }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if(currentSpeakingEl){ currentSpeakingEl.classList.remove('speaking'); }
  if(el){ el.classList.add('speaking'); currentSpeakingEl = el; }

  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'zh-CN';
  var v = pickBestVoice(lang || 'zh-CN');
  if(v){ u.voice = v; u.lang = v.lang; }
  // ── ປັບໃຫ້ເດັກນ້ອຍຮຽນຟັງເຂົ້າໃຈ ──
  u.rate = 0.55;   // ຊ້າຫຼາຍ ໃຫ້ເດັກຟັງທັນ ໂດຍສະເພາະພາສາຈີນ
  u.pitch = 1.15;  // pitch ສູງ ສຽງຄົມຕັດຫູ
  u.volume = 1.0;
  u.onend = function(){ if(el) el.classList.remove('speaking'); if(currentSpeakingEl === el) currentSpeakingEl = null; };
  u.onerror = function(){ if(el) el.classList.remove('speaking'); };
  setTimeout(function(){
    try{ window.speechSynthesis.speak(u); }catch(e){}
  }, 60);
}

var currentTopic = 'numbers';
function selectTopic(key){
  if(!topics[key]) return;
  currentTopic = key;
  document.querySelectorAll('.topic-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-topic') === key);
  });
  renderTopic();
}

function renderTopic(){
  var t = topics[currentTopic];
  document.getElementById('tt-ico').textContent = t.icon;
  document.getElementById('tt-text').textContent = t.title;
  document.getElementById('tt-sub').textContent = t.items.length + ' ຄຳ';
  var grid = document.getElementById('items-grid');
  grid.innerHTML = '';
  t.items.forEach(function(item){
    var card = document.createElement('div');
    card.className = 'item-card';
    if(t.isPinyin) card.classList.add('pinyin');
    if(item.bg){ card.style.background = item.bg; }
    if(item.fg){ card.style.color = item.fg; }
    var emojiEl = document.createElement('div');
    emojiEl.className = 'item-emoji';
    emojiEl.textContent = t.isPinyin ? item.pinyin : item.emoji;
    var cnEl = document.createElement('div');
    cnEl.className = 'item-cn';
    cnEl.textContent = item.cn;
    var pyEl = document.createElement('div');
    pyEl.className = 'item-pinyin';
    pyEl.textContent = item.py;
    var laoEl = document.createElement('div');
    laoEl.className = 'item-lao';
    laoEl.textContent = item.lao;
    card.appendChild(emojiEl);
    card.appendChild(cnEl);
    card.appendChild(pyEl);
    card.appendChild(laoEl);
    card.addEventListener('click', function(){
      var spokenText;
      if(t.isPinyin){
        // ສຳລັບ pinyin: ໃຫ້ TTS ອ່ານຕົວອັກສອນຈີນຈາກ cn (ຊັດເຈນກວ່າອ່ານ pinyin ດຽວ)
        // ເຊັ່ນ "爸 bà" → ອ່ານ "爸"; ສຳລັບ tones "妈 (ແມ່)" → ອ່ານ "妈"
        var cnChar = extractChinese(item.cn);
        // ສຳລັບ tones, ອ່ານ pinyin ກ່ອນ ແລະ tone ຈະຖືກອອກສຽງຖືກຕ້ອງ
        spokenText = cnChar || item.pinyin || item.cn;
      } else {
        spokenText = item.cn;
      }
      speak(spokenText, 'zh-CN', card);
    });
    grid.appendChild(card);
  });
}

renderTopic();
</script>
<script>
function navigateTo(name){
  try {
    if(window.parent && window.parent !== window){
      window.parent.postMessage({type:'switchView', view: name}, '*');
      return;
    }
  } catch(e){}
  window.location.href = name + '.html';
}
</script>
