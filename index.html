  }
  hint.innerHTML='ແບ່ງ '+ch+' <b>'+a+'</b> ໂຕ ໃສ່ 🧺 <b>'+b+'</b> ກະຕ່າເທົ່າໆກັນ → ກະຕ່າລະຈັກໂຕ?';
}

// ── Next question ──
function nextQuestion(){
  answered=false; crossedCount=0; subB=0;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('stars').textContent='';
  document.getElementById('next-btn').style.display='none';

  var q=generateQuestion();
  correctAnswer=q.ans;
  currentQ=q;
  renderQuestion(q);

  var isSubVis=(mode==='sub'&&level<=2);
  var isMulVis=(mode==='mul'&&level<=2);
  var isDivVis=(mode==='div'&&level<=2);
  var isAddVis=(mode==='add'&&level===1);

  // ສະແດງ/ເຊື່ອງ ຮູບປະກອບແຕ່ລະປະເພດ
  document.getElementById('sub-hint').style.display    = isSubVis?'block':'none';
  document.getElementById('char-grid').style.display   = isSubVis?'flex':'none';
  document.getElementById('sub-counter').style.display = isSubVis?'block':'none';

  document.getElementById('group-hint').style.display  = (isMulVis||isDivVis)?'inline-block':'none';
  document.getElementById('group-area').style.display  = (isMulVis||isDivVis)?'flex':'none';

  document.getElementById('character-row').style.display = isAddVis?'flex':'none';

  if(isSubVis){
    buildSubGrid(q.a,q.b);
  } else if(isMulVis){
    buildMulGroups(q.a,q.b,currentChar);
  } else if(isDivVis){
    buildDivGroups(q.a,q.b,q.ans,currentChar);
  } else if(isAddVis){
    // ສະແດງ emoji ສຳລັບ a + b ໂດຍແບ່ງເປັນກຸ່ມ 5 ເພື່ອງ່າຍຕໍ່ການນັບ
    var row=document.getElementById('character-row');
    row.innerHTML='';
    var showA=Math.min(q.a,10), showB=Math.min(q.b,10);
    appendEmojiGroup(row, q.charA, showA, 'add-emoji', 'add-sep5');
    var plus=document.createElement('span');
    plus.className='add-plus';
    plus.textContent='➕';
    row.appendChild(plus);
    appendEmojiGroup(row, q.charB, showB, 'add-emoji', 'add-sep5');
  }

  if(level<=2){
    document.getElementById('answer-grid').style.display='grid';
    document.getElementById('input-row').style.display='none';
    var choices=makeChoices(q.ans);
    var grid=document.getElementById('answer-grid');
    grid.innerHTML='';
    choices.forEach(function(c){
      var btn=document.createElement('button');
      btn.className='ans-btn'; btn.textContent=c;
      btn.onclick=function(){checkAnswer(c,btn);};
      grid.appendChild(btn);
    });
  } else {
    document.getElementById('answer-grid').style.display='none';
    document.getElementById('input-row').style.display='flex';
    var inp=document.getElementById('ans-input');
    inp.value=''; inp.style.borderColor='';
    setTimeout(function(){inp.focus();},100);
  }
}

// ── Core check logic ──
function applyResult(ok){
  totalCount++;
  document.getElementById('total-count').textContent=totalCount;
  var pts=0;
  if(ok){
    correctCount++; streak++;
    stageProgress++;
    pts=streak>=3?20:10; score+=pts;
    document.getElementById('correct-count').textContent=correctCount;
    document.getElementById('score').textContent=score;
    document.getElementById('streak').textContent=streak;
    document.getElementById('feedback').textContent='🎉 ຖືກຕ້ອງ! ເກັ່ງຫຼາຍ!';
    document.getElementById('feedback').className='feedback ok';
    document.getElementById('stars').textContent=streak>=5?'⭐⭐⭐':streak>=3?'⭐⭐':'⭐';
    ansHistory.push('ok'); lastOk=true; lastPts=pts;
    playCorrectSound();
    if(streak>=3)launchConfetti();
    updateStageUI();
    if(stageProgress >= STAGE_GOAL){
      stageJustCompleted = true;
    }
  } else {
    streak=0;
    document.getElementById('streak').textContent='0';
    document.getElementById('feedback').textContent='💡 ຄຳຕອບແມ່ນ '+correctAnswer;
    document.getElementById('feedback').className='feedback no';
    ansHistory.push('no'); lastOk=false; lastPts=0;
    playWrongSound();
  }
  renderHistory();
  document.getElementById('next-btn').style.display='block';
  return pts;
}

function checkAnswer(chosen,btn){
  if(answered)return;
  answered=true;
  var ok=(chosen===correctAnswer);
  btn.classList.add(ok?'correct':'wrong');
  if(!ok){
    document.querySelectorAll('.ans-btn').forEach(function(b){
      if(parseInt(b.textContent)===correctAnswer)b.classList.add('correct');
    });
  }
  document.querySelectorAll('.ans-btn').forEach(function(b){b.disabled=true;b.style.pointerEvents='none';});
  var pts=applyResult(ok);
  setTimeout(function(){openPopup(ok,pts);},400);
}

function checkInput(){
  if(answered)return;
  var val=parseInt(document.getElementById('ans-input').value);
  if(isNaN(val))return;
  answered=true;
  var ok=(val===correctAnswer);
  document.getElementById('ans-input').style.borderColor=ok?'#5BAD6F':'#E85D5D';
  var pts=applyResult(ok);
  setTimeout(function(){openPopup(ok,pts);},400);
}

// ── Popup ──
function openPopup(ok,pts){
  if(ok===undefined){ok=lastOk;pts=lastPts;}
  // ── ຖ້າຫາກຫາກໍ່ຜ່ານດ່ານ ສະແດງປ໋ອບອັບພິເສດ ──
  if(stageJustCompleted){
    stageJustCompleted = false;
    openStagePopup();
    return;
  }
  var icon,title,sub,badge;
  if(ok){
    var icons=['🎉','🌟','🏆','🥳','✨','🎊'];
    icon=icons[Math.floor(Math.random()*icons.length)];
    title=streak>=5?'ອາດມາກ! ສຸດຍອດ!':streak>=3?'ເກັ່ງຫຼາຍ!':'ຖືກຕ້ອງ!';
    sub=streak>=3?'🔥 ຕໍ່ເນື່ອງ '+streak+' ຄຳ!':'ດີຫຼາຍ ເດີ!';
    badge='⭐ +'+pts+' ຄະແນນ';
    // ── ໂຫຼດຮູບເດັກນ້ອຍ ເມື່ອຕອບຖືກ ──
    loadKidsPhoto();
  } else {
    // ບໍ່ສະແດງຮູບເມື່ອຕອບຜິດ
    var ovl_x = document.getElementById('popup-overlay');
    var pw_x = document.getElementById('popup-photo-wrap');
    if(pw_x) pw_x.classList.remove('has-image');
    if(ovl_x) ovl_x.classList.remove('with-photo');
    icon='💡';
    title='ໄດ້ຮຽນຮູ້ແລ້ວ!';
    sub='ຄຳຕອບແມ່ນ: '+correctAnswer;
    badge='💪 ຄ່ອຍໆ ພະຍາຍາມ!';
  }
  document.getElementById('popup-icon').textContent=icon;
  document.getElementById('popup-title').textContent=title;
  document.getElementById('popup-sub').textContent=sub;
  document.getElementById('popup-badge').textContent=badge;
  document.getElementById('popup-overlay').classList.add('show');
}

function loadKidsPhoto(callback){
  var photoWrap = document.getElementById('popup-photo-wrap');
  var photo = document.getElementById('popup-photo');
  var ovl = document.getElementById('popup-overlay');
  if(!photo || !photoWrap){ if(callback) callback(false); return; }
  photoWrap.classList.remove('has-image');
  ovl.classList.remove('with-photo');
  var attempts = ['kids.jpg', 'kids.jpeg', 'kids.png'];
  var idx = 0;
  photo.onload = function(){
    photoWrap.classList.add('has-image');
    ovl.classList.add('with-photo');
    if(callback) callback(true);
  };
  photo.onerror = function(){
    if(idx < attempts.length) tryNext();
    else {
      photoWrap.classList.remove('has-image');
      ovl.classList.remove('with-photo');
      if(callback) callback(false);
    }
  };
  function tryNext(){
    if(idx >= attempts.length) return;
    photo.src = attempts[idx++] + '?t=' + Date.now();
  }
  tryNext();
}

function updateStageUI(){
  var sn = document.getElementById('stage-num');
  if(sn) sn.textContent = stage;
  var fill = document.getElementById('progress-fill');
  if(fill){
    var pct = Math.min(100, (stageProgress/STAGE_GOAL)*100);
    fill.style.width = pct + '%';
    fill.classList.toggle('shine', stageProgress > 0 && stageProgress < STAGE_GOAL);
  }
  var dots = document.querySelectorAll('#progress-stars .ps-dot');
  dots.forEach(function(d, i){
    d.classList.toggle('filled', i < stageProgress);
  });
}

function openStagePopup(){
  var bonus = 50 + (stage * 10);
  score += bonus;
  document.getElementById('score').textContent = score;
  var passedStage = stage;
  stage++;
  stageProgress = 0;
  // ສະແດງເອັຟເຟັກໃນແຖບ
  var bar = document.getElementById('stage-bar');
  if(bar){
    bar.classList.add('complete');
    setTimeout(function(){ bar.classList.remove('complete'); }, 900);
  }
  // ດ່ານທີ 5, 10, 15... → ແນະນຳເລື່ອນລະດັບ
  var levelUpHint = '';
  if(passedStage % 3 === 0 && level < 3){
    levelUpHint = ' ລອງເລື່ອນລະດັບໃຫ້ຍາກຂຶ້ນເລີຍ! 🚀';
  } else if(passedStage % 5 === 0){
    levelUpHint = ' ເຈົ້າເກັ່ງສຸດໆ! 🎯';
  }
  var titles = ['🎊 ຜ່ານດ່ານໃໝ່!','🏆 ສຸດຍອດ!','🌟 ດີຫຼາຍ!','✨ ຍອດຍ້ຽມ!'];
  var title = titles[Math.floor(Math.random()*titles.length)];
  document.getElementById('popup-icon').textContent = '🏆';
  document.getElementById('popup-title').textContent = title;
  document.getElementById('popup-sub').textContent = 'ຜ່ານດ່ານທີ ' + passedStage + ' ສຳເລັດ! ໄປດ່ານທີ ' + stage + ' ກັນເລີຍ!' + levelUpHint;
  document.getElementById('popup-badge').textContent = '🌟 +' + bonus + ' ຄະແນນພິເສດ!';
  var ovl = document.getElementById('popup-overlay');
  ovl.classList.add('stage-mode');
  loadKidsPhoto();
  ovl.classList.add('show');
  setTimeout(function(){
    if(typeof launchConfetti === 'function'){
      launchConfetti();
      setTimeout(launchConfetti, 250);
      setTimeout(launchConfetti, 500);
      setTimeout(launchConfetti, 750);
    }
  }, 100);
  playStageSound();
  updateStageUI();
}

function playStageSound(){
  if(!soundOn) return;
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    var ctx = new Ctx();
    // 4-note ascending fanfare: C, E, G, C(high)
    var notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach(function(freq, i){
      var t0 = ctx.currentTime + i * 0.13;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.22, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.32);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + 0.34);
    });
    setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 1500);
  }catch(e){}
}

function closePopup(){
  document.getElementById('popup-overlay').classList.remove('show');
  document.getElementById('popup-overlay').classList.remove('stage-mode');
  document.getElementById('popup-overlay').classList.remove('with-photo');
}

function popupNext(){
  document.getElementById('popup-overlay').classList.remove('show');
  setTimeout(nextQuestion,120);
}

document.getElementById('popup-overlay').addEventListener('click',function(e){
  if(e.target===this)closePopup();
});

  h.innerHTML='';

    var d=document.createElement('span');
    d.className='hist-dot';
    d.style.background=r==='ok'?'#5BAD6F':'#E85D5D';
    d.textContent=r==='ok'?'✓':'✗';
    h.appendChild(d);
  });
}

// ── Confetti ──
function launchConfetti(){
  var wrap=document.getElementById('confetti-wrap');
  wrap.innerHTML='';
  for(var i=0;i<30;i++){
    var p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=randInt(5,95)+'%'; p.style.top='-12px';
    p.style.background=confColors[randInt(0,confColors.length-1)];
    p.style.width=randInt(7,14)+'px'; p.style.height=randInt(7,14)+'px';
    p.style.borderRadius=randInt(0,1)?'50%':'3px';
    p.style.animationDelay=(i*0.04)+'s';
    p.style.animationDuration=(0.9+Math.random()*0.6)+'s';
    wrap.appendChild(p);
  }
  setTimeout(function(){wrap.innerHTML='';},2400);
}

document.getElementById('ans-input').addEventListener('keydown',function(e){
  if(e.key==='Enter')checkInput();
});

// ຕັ້ງຄ່າປຸ່ມສຽງເລີ່ມຕົ້ນ ຕາມການຕັ້ງຄ່າທີ່ບັນທຶກໄວ້
(function(){

})();

nextQuestion();
<\/script>

<script>
/* === Sound on/off === */
var soundOn = true;
function toggleSound(){
  soundOn = !soundOn;
  var btn = document.getElementById('sound-btn');
  if(soundOn){ btn.textContent = '🔊'; btn.classList.remove('muted'); }
  else { btn.textContent = '🔇'; btn.classList.add('muted'); window.speechSynthesis.cancel(); }
}

/* === Menu === */
function toggleMenu(e){
  if(e) e.stopPropagation();
  var panel = document.getElementById('menu-panel');
  if(panel.classList.contains('show')){ closeMenu(); } else { openMenu(); }
}
function openMenu(){
  document.getElementById('menu-btn').classList.add('open');
  document.getElementById('menu-panel').classList.add('show');
  document.getElementById('menu-overlay').classList.add('show');
}
function closeMenu(){
  document.getElementById('menu-btn').classList.remove('open');
  document.getElementById('menu-panel').classList.remove('show');
  document.getElementById('menu-overlay').classList.remove('show');
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeMenu();
});

/* === TTS - ປັບສຳລັບເດັກນ້ອຍຮຽນ ຊ້າ + ຊັດເຈນ === */
var voicesReady = false;
function loadVoices(){
  var v = window.speechSynthesis.getVoices();
  voicesReady = v && v.length > 0;
}
if('speechSynthesis' in window){
  try{ window.speechSynthesis.getVoices(); }catch(e){}
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  // ບາງເບຣົາເຊີໂຫຼດສຽງຊ້າ ລໍຖ້າເພີ່ມ
  setTimeout(loadVoices, 500);
  setTimeout(loadVoices, 1500);
}

/* ເລືອກສຽງທີ່ດີທີ່ສຸດ - ໃຫ້ຄະແນນ ແລະ ເລືອກສຽງຄຸນະພາບສູງສຸດ */
function pickBestVoice(lang){
  var voices = window.speechSynthesis.getVoices() || [];
  if(!voices.length) return null;
  var langPrefix = lang.toLowerCase().substr(0,2);
  var candidates = voices.filter(function(v){
    return v.lang && v.lang.toLowerCase().substr(0,2) === langPrefix;
  });
  if(!candidates.length) return null;
  function score(v){
    var s = 0;
    var name = (v.name||'').toLowerCase();
    if(v.lang.toLowerCase() === lang.toLowerCase()) s += 100;
    // ສຽງຄຸນະພາບສູງ (Premium / Neural / Natural)
    if(name.indexOf('natural')>=0) s += 50;
    if(name.indexOf('neural')>=0) s += 50;
    if(name.indexOf('premium')>=0) s += 45;
    if(name.indexOf('enhanced')>=0) s += 40;
    if(name.indexOf('online')>=0) s += 30;
    if(name.indexOf('google')>=0) s += 35;
    if(name.indexOf('microsoft')>=0) s += 30;
    if(name.indexOf('apple')>=0) s += 25;
    // ສຽງຜູ້ຍິງ (ດີສຳລັບເດັກ ຟັງງ່າຍ)
    if(name.indexOf('female')>=0) s += 15;
    if(name.indexOf('woman')>=0) s += 15;
    // ຊື່ສຽງຜູ້ຍິງທີ່ຮູ້ຈັກໃນແຕ່ລະພາສາ
    if(/(samantha|karen|moira|tessa|fiona|zira|hazel|catherine|allison|ava|joanna|salli|ivy|jenny|aria|emma|sonia|natasha)/i.test(v.name||'')) s += 12;
    if(/(child|kids|junior)/i.test(v.name||'')) s += 8;
    if(v.default) s += 3;
    return s;
  }
  candidates.sort(function(a,b){ return score(b) - score(a); });
  return candidates[0];
}

var currentSpeakingEl = null;
function speak(text, lang, el){
  if(!soundOn) return;
  if(!('speechSynthesis' in window)) return;
  // ລໍຖ້າສຽງໂຫຼດກ່ອນ
  var voices = window.speechSynthesis.getVoices();
  if(!voices.length){
    setTimeout(function(){ speak(text, lang, el); }, 250);
    return;
  }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if(currentSpeakingEl){ currentSpeakingEl.classList.remove('speaking'); }
  if(el){ el.classList.add('speaking'); currentSpeakingEl = el; }

  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US';
  var v = pickBestVoice(lang || 'en-US');
  if(v){ u.voice = v; u.lang = v.lang; }
  // ── ປັບຄ່າໃຫ້ເດັກນ້ອຍຟັງເຂົ້າໃຈ ──
  u.rate = 0.65;   // ຊ້າ - ໃຫ້ເດັກຟັງທັນ
  u.pitch = 1.15;  // ສູງເລັກນ້ອຍ - ນ້ຳສຽງສົດໃສ ຄ້າຍຄຸນຄູ
  u.volume = 1.0;
  u.onend = function(){ if(el) el.classList.remove('speaking'); if(currentSpeakingEl === el) currentSpeakingEl = null; };
  u.onerror = function(){ if(el) el.classList.remove('speaking'); };
  // Chrome ຕ້ອງຫຍຸດສັ້ນໆຫຼັງ cancel
  setTimeout(function(){
    try{ window.speechSynthesis.speak(u); }catch(e){}
  }, 60);
}

var currentTopic = 'alphabet';
function selectTopic(key){
  if(!topics[key]) return;
  currentTopic = key;
  document.querySelectorAll('.topic-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-topic') === key);
  });
  renderTopic();
}

function renderTopic(){
  var t = topics[currentTopic];
  document.getElementById('tt-ico').textContent = t.icon;
  document.getElementById('tt-text').textContent = t.title;
  document.getElementById('tt-sub').textContent = t.items.length + ' ຄຳ';
  var grid = document.getElementById('items-grid');
  grid.classList.toggle('letters', !!t.isLetters);
  grid.innerHTML = '';
  t.items.forEach(function(item){
    var card = document.createElement('div');
    card.className = 'item-card';
    if(item.bg){ card.style.background = item.bg; }
    if(item.fg){ card.style.color = item.fg; }
    var emojiEl = document.createElement('div');
    emojiEl.className = 'item-emoji';
    emojiEl.textContent = t.isLetters ? item.en : item.emoji;
    var enEl = document.createElement('div');
    enEl.className = 'item-en';
    enEl.textContent = t.isLetters ? (item.sub) : item.en;
    card.appendChild(emojiEl);
    card.appendChild(enEl);
    if(item.lao){
      var laoEl = document.createElement('div');
      laoEl.className = 'item-lao';
      laoEl.textContent = item.lao;
      card.appendChild(laoEl);
    }
    card.addEventListener('click', function(){
      var spoken = t.isLetters ? item.en : item.en;
      speak(spoken, 'en-US', card);
    });
    grid.appendChild(card);
  });
}

renderTopic();

    }
  } catch(e){}
  window.location.href = name + '.html';
}

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ຮຽນພາສາຈີນ ມ່ວນໆ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Phetsarath OT';
    src: local('Phetsarath OT'), local('Phetsarath_OT'), local('Phetsarath'),
         url('https://cdn.jsdelivr.net/gh/lao-dictionary/lao-fonts@master/Phetsarath_OT.ttf') format('truetype');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  :root {
    --bg: #FFF8EE; --card: #FFFFFF;
    --purple: #7C6FCD; --purple-light: #EEE9FF;
    --green: #5BAD6F; --green-light: #E6F7EA;
    --red: #E85D5D; --red-light: #FDEAEA;
    --blue: #4FA3E0; --blue-light: #E0F0FF;
    --yellow: #F9C74F;
    --text: #3A2E5A; --text-soft: #7B6F9A;
    --border: #E8DFF8;
    --shadow: 0 4px 16px rgba(232,93,93,0.13);
    --radius: 20px; --radius-lg: 28px;
    --cn: #D63A3A; --cn-light: #FFE4E4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
    background: var(--bg); min-height: 100vh;
    background-image:
      radial-gradient(circle at 10% 20%, #FFE0E0 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, #FFEFB8 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, #FFF5E5 0%, transparent 60%);
  }
  .app {
    max-width: 600px; margin: 0 auto;
    padding: clamp(10px,3vw,20px);
    min-height: 100vh; display: flex; flex-direction: column;
    gap: clamp(10px,2.5vw,16px); position: relative;
  }
  .sound-btn {
    position: absolute;
    top: clamp(10px,3vw,20px); right: clamp(10px,3vw,20px);
    width: clamp(38px,9vw,44px); height: clamp(38px,9vw,44px);
    border-radius: 50%; border: 2.5px solid var(--border);
    background: var(--card); color: var(--text);
    font-size: clamp(15px,4vw,20px); cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    z-index: 10; transition: all 0.15s;
    font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
    display: flex; align-items: center; justify-content: center;
    line-height: 1; padding: 0;
  }
  .sound-btn:active { transform: scale(0.9); }
  .sound-btn.muted { background: #FDEAEA; border-color: var(--red); opacity: 0.85; }

  .menu-btn {
    position: absolute;
    top: clamp(10px,3vw,20px); left: clamp(10px,3vw,20px);
    width: clamp(38px,9vw,44px); height: clamp(38px,9vw,44px);
    border-radius: 50%; border: 2.5px solid var(--border);
    background: var(--card); color: var(--cn);
    font-size: clamp(18px,5vw,24px); cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    z-index: 30; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
    line-height: 1; padding: 0; font-weight: 900;
  }
  .menu-btn:active { transform: scale(0.9); }
  .menu-btn.open { background: var(--cn); color: #fff; border-color: var(--cn); }

  .menu-overlay {
    position: fixed; inset: 0;
    background: rgba(58,46,90,0.45);
    z-index: 50; display: none;
    backdrop-filter: blur(3px);
  }
  .menu-overlay.show { display: block; animation: fade-in 0.18s; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .menu-panel {
    position: fixed;
    top: clamp(62px,14vw,76px); left: clamp(10px,3vw,20px);
    background: var(--card); border: 2.5px solid var(--cn);
    border-radius: var(--radius-lg);
    box-shadow: 0 10px 30px rgba(58,46,90,0.28);
    padding: clamp(10px,2.5vw,14px);
    z-index: 60; display: none;
    min-width: clamp(220px,60vw,280px);
    animation: slide-down 0.22s ease-out;
  }
  .menu-panel.show { display: block; }
  @keyframes slide-down {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .menu-title {
    font-size: clamp(13px,3.4vw,15px); font-weight: 900;
    color: var(--cn); text-align: center;
    padding: 4px 0 8px; border-bottom: 2px dashed var(--border);
    margin-bottom: 8px;
  }
  .menu-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: clamp(10px,2.5vw,14px);
    margin-bottom: 6px;
    border: 2px solid var(--border); border-radius: var(--radius);
    background: var(--card); color: var(--text);
    font-size: clamp(14px,3.6vw,16px); font-weight: 800;
    cursor: pointer; text-align: left;
    font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
    transition: all 0.15s; text-decoration: none;
  }
  .menu-item:last-child { margin-bottom: 0; }
  .menu-item:hover { background: var(--cn-light); border-color: var(--cn); }
  .menu-item:active { transform: scale(0.97); }
  .menu-item.current {
    background: var(--cn-light); border-color: var(--cn);
    color: var(--cn); cursor: default;
  }
  .menu-item.current::after { content: ' ✓'; margin-left: auto; font-weight: 900; }
  .menu-item .menu-ico {
    font-size: clamp(20px,5vw,24px); line-height: 1;
    width: clamp(34px,8vw,40px); height: clamp(34px,8vw,40px);
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; flex-shrink: 0;
  }
  .menu-item.mi-en .menu-ico { background: var(--blue-light); }
  .menu-item.mi-math .menu-ico { background: var(--purple-light); }
  .menu-item.mi-cn .menu-ico { background: var(--cn-light); }
  .menu-item.mi-lo .menu-ico { background: #FFF4D6; }

  .header { text-align: center; padding: clamp(6px,2vw,14px) 0 2px; }
  .header-icon { font-size: clamp(36px,10vw,56px); display: block; margin-bottom: 4px; animation: bounce 2s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .header-title { font-size: clamp(22px,6.5vw,34px); font-weight: 900; color: var(--cn); }
  .header-sub { font-size: clamp(11px,3vw,14px); color: var(--text-soft); font-weight: 600; }

  .topic-tabs {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: clamp(6px,1.8vw,10px);
  }
  .topic-btn {
    padding: clamp(9px,2.4vw,14px) 6px;
    border: 2.5px solid var(--border); border-radius: var(--radius);
    background: var(--card); color: var(--text-soft);
    font-size: clamp(11px,3vw,14px); font-weight: 800;
    cursor: pointer; text-align: center; transition: all 0.18s;
    font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
    line-height: 1.25;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .topic-btn .topic-ico { font-size: clamp(18px,5vw,26px); display: block; line-height: 1; }
  .topic-btn:active { transform: scale(0.95); }
  .topic-btn.active {
    background: var(--cn-light); border-color: var(--cn); color: var(--cn);
    transform: translateY(-2px); box-shadow: 0 4px 12px rgba(214,58,58,0.22);
  }

  .topic-title-bar {
    background: var(--card); border-radius: var(--radius);
    padding: clamp(10px,2.6vw,14px) clamp(14px,3vw,20px);
    box-shadow: var(--shadow); border: 2px solid var(--border);
    display: flex; align-items: center; gap: 10px; justify-content: center;
  }
  .topic-title-bar .tt-ico { font-size: clamp(22px,5.5vw,30px); line-height: 1; }
  .topic-title-bar .tt-text {
    font-size: clamp(15px,4vw,19px); font-weight: 900; color: var(--cn);
  }
  .topic-title-bar .tt-sub {
    font-size: clamp(11px,2.8vw,13px); color: var(--text-soft); font-weight: 700;
    margin-left: 6px;
  }

  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(95px,24vw,120px), 1fr));
    gap: clamp(8px,2vw,12px);
  }
  .item-card {
    background: var(--card); border: 3px solid var(--border);
    border-radius: var(--radius); padding: clamp(10px,2.5vw,14px) 6px;
    text-align: center; cursor: pointer;
    transition: all 0.18s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.06);
    font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; min-height: clamp(130px,32vw,160px);
    user-select: none; position: relative; overflow: hidden;
  }
  .item-card::before {
    content: '🔊'; position: absolute;
    top: 6px; right: 8px; font-size: clamp(11px,2.8vw,14px);
    opacity: 0.5;
  }
  .item-card:active { transform: scale(0.95) translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.06); }
  .item-card:hover { border-color: var(--cn); background: var(--cn-light); }
  .item-card.speaking {
    background: var(--cn); border-color: var(--cn); color: #fff;
    transform: scale(1.05);
    box-shadow: 0 4px 14px rgba(214,58,58,0.4), 0 0 0 4px rgba(214,58,58,0.25);
    animation: pulse-card 0.9s ease-in-out infinite;
  }
  .item-card.speaking::before { color: #fff; opacity: 1; }
  .item-card.speaking .item-pinyin,
  .item-card.speaking .item-lao { color: rgba(255,255,255,0.9); }
  @keyframes pulse-card {
    0%, 100% { transform: scale(1.04); }
    50%      { transform: scale(1.10); }
  }
  .item-emoji { font-size: clamp(26px,7vw,38px); line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15)); }
  .item-cn {
    font-size: clamp(20px,5.5vw,28px); font-weight: 900;
    color: inherit; line-height: 1.1;
    font-family: 'Noto Sans SC', 'Phetsarath OT', sans-serif;
  }
  .item-card.speaking .item-cn { color: #fff; }
  .item-pinyin {
    font-size: clamp(11px,3vw,14px); font-weight: 800;
    color: var(--cn); line-height: 1.1;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-style: italic;
  }
  .item-lao {
    font-size: clamp(10px,2.6vw,12px); color: var(--text-soft); font-weight: 700;
    line-height: 1.1;
  }

  .info-tip {
    text-align: center; font-size: clamp(11px,3vw,13px);
    color: var(--text-soft); font-weight: 700;
    background: var(--card); border-radius: var(--radius);
    padding: clamp(8px,2vw,12px); border: 2px dashed var(--border);
  }


  /* Pinyin items - big pinyin display */
  .item-card.pinyin .item-emoji {
    font-size: clamp(36px,9vw,52px);
    font-weight: 900;
    color: var(--cn);
    font-family: 'Segoe UI', system-ui, sans-serif;
    margin-bottom: 4px;
  }
  .item-card.pinyin.speaking .item-emoji { color: #fff; }
  .item-card.pinyin .item-cn {
    font-size: clamp(15px,4vw,20px);
    font-family: 'Noto Sans SC', sans-serif;
  }
  .item-card.pinyin {
    min-height: clamp(140px,34vw,170px);
  }
  @media (max-width: 360px) {
    .topic-tabs { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="app">
  <button class="sound-btn" id="sound-btn" onclick="toggleSound()" title="ເປີດ/ປິດສຽງ">🔊</button>
  <button class="menu-btn" id="menu-btn" onclick="toggleMenu(event)" title="ເມນູ" aria-label="ເມນູ">☰</button>
  <div class="menu-overlay" id="menu-overlay" onclick="closeMenu()"></div>
  <div class="menu-panel" id="menu-panel" role="menu" aria-label="ເລືອກວິຊາ">
    <div class="menu-title">📚 ເລືອກວິຊາທີ່ຢາກຮຽນ</div>
    <a class="menu-item mi-en" href="javascript:void(0)" onclick="navigateTo('english')">
      <span class="menu-ico">🔤</span>
      <span>ຮຽນພາສາອັງກິດ</span>
    </a>
    <a class="menu-item mi-math" href="javascript:void(0)" onclick="navigateTo('math')">
      <span class="menu-ico">🧮</span>
      <span>ຮຽນຄະນິດສາດ</span>
    </a>
    <button class="menu-item mi-cn current" type="button" onclick="closeMenu()">
      <span class="menu-ico">🀄</span>
      <span>ຮຽນພາສາຈີນ</span>
    </button>
    <a class="menu-item mi-lo" href="javascript:void(0)" onclick="navigateTo('lao')">
      <span class="menu-ico">🇱🇦</span>

    </a>

  <div class="header">
    <span class="header-icon">🀄</span>
    <div class="header-title">ຮຽນພາສາຈີນ</div>
    <div class="header-sub">ແຕະທີ່ຮູບ ເພື່ອຟັງສຽງອ່ານ 🌟 DeDyDeMy 🌟</div>
  </div>

  <div class="topic-tabs" id="topic-tabs">
    <button class="topic-btn active" data-topic="numbers" onclick="selectTopic('numbers')">
      <span class="topic-ico">🔢</span><span>ຕົວເລກ 一-十</span>
    </button>
    <button class="topic-btn" data-topic="fruits" onclick="selectTopic('fruits')">
      <span class="topic-ico">🍎</span><span>ໝາກໄມ້</span>
    </button>
    <button class="topic-btn" data-topic="body" onclick="selectTopic('body')">
      <span class="topic-ico">👤</span><span>ຮ່າງກາຍ</span>
    </button>
    <button class="topic-btn" data-topic="colors" onclick="selectTopic('colors')">
      <span class="topic-ico">🎨</span><span>ສີ</span>
    </button>
    <button class="topic-btn" data-topic="days" onclick="selectTopic('days')">
      <span class="topic-ico">📅</span><span>ວັນໃນອາທິດ</span>
    </button>
    <button class="topic-btn" data-topic="months" onclick="selectTopic('months')">
      <span class="topic-ico">🗓️</span><span>ເດືອນ</span>
    </button>
    <button class="topic-btn" data-topic="pinyin_tones" onclick="selectTopic('pinyin_tones')">
      <span class="topic-ico">🎵</span><span>ສຽງ 4 ຊັ້ນ</span>
    </button>
    <button class="topic-btn" data-topic="pinyin_initials" onclick="selectTopic('pinyin_initials')">
      <span class="topic-ico">🔡</span><span>拼音 ຕົ້ນ</span>
    </button>
    <button class="topic-btn" data-topic="pinyin_finals" onclick="selectTopic('pinyin_finals')">
      <span class="topic-ico">🅰️</span><span>拼音 ທ້າຍ</span>
    </button>
    <button class="topic-btn" data-topic="greetings" onclick="selectTopic('greetings')">
      <span class="topic-ico">👋</span><span>ການທັກທາຍ</span>
    </button>
    <button class="topic-btn" data-topic="family" onclick="selectTopic('family')">
      <span class="topic-ico">👨‍👩‍👧</span><span>ຄອບຄົວ</span>
    </button>
    <button class="topic-btn" data-topic="food" onclick="selectTopic('food')">
      <span class="topic-ico">🍚</span><span>ອາຫານ</span>
    </button>
    <button class="topic-btn" data-topic="animals" onclick="selectTopic('animals')">
      <span class="topic-ico">🐶</span><span>ສັດ</span>
    </button>

      <span class="topic-ico">🎒</span><span>ໂຮງຮຽນ</span>
    </button>
    <button class="topic-btn" data-topic="verbs" onclick="selectTopic('verbs')">
      <span class="topic-ico">🏃</span><span>ການກະທຳ</span>
    </button>
    <button class="topic-btn" data-topic="phrases" onclick="selectTopic('phrases')">
      <span class="topic-ico">💬</span><span>ປະໂຫຍກໃຊ້ປະຈຳວັນ</span>

  <div class="topic-title-bar">
    <span class="tt-ico" id="tt-ico">🔢</span>
    <span class="tt-text" id="tt-text">ຕົວເລກ 一 - 十</span>
    <span class="tt-sub" id="tt-sub">10 ຄຳ</span>
  </div>

  <div class="items-grid" id="items-grid"></div>

  <div class="info-tip">💡 ກົດທີ່ກ່ອງເພື່ອຟັງສຽງອ່ານພາສາຈີນ</div>
</div>

<script>
var soundOn = true;
function toggleSound(){
  soundOn = !soundOn;
  var btn = document.getElementById('sound-btn');
  if(soundOn){ btn.textContent = '🔊'; btn.classList.remove('muted'); }
  else { btn.textContent = '🔇'; btn.classList.add('muted'); window.speechSynthesis.cancel(); }
}

function toggleMenu(e){
  if(e) e.stopPropagation();
  var panel = document.getElementById('menu-panel');
  if(panel.classList.contains('show')){ closeMenu(); } else { openMenu(); }
}
function openMenu(){
  document.getElementById('menu-btn').classList.add('open');
  document.getElementById('menu-panel').classList.add('show');
  document.getElementById('menu-overlay').classList.add('show');
}
function closeMenu(){
  document.getElementById('menu-btn').classList.remove('open');
  document.getElementById('menu-panel').classList.remove('show');
  document.getElementById('menu-overlay').classList.remove('show');
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeMenu();
});

/* === TTS - ປັບສຳລັບເດັກນ້ອຍຮຽນພາສາຈີນ ຊ້າ + ຄົມ === */
var voicesReady = false;
function loadVoices(){
  var v = window.speechSynthesis.getVoices();
  voicesReady = v && v.length > 0;
}
if('speechSynthesis' in window){
  try{ window.speechSynthesis.getVoices(); }catch(e){}
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 500);
  setTimeout(loadVoices, 1500);
}

function pickBestVoice(lang){
  var voices = window.speechSynthesis.getVoices() || [];
  if(!voices.length) return null;
  var langPrefix = lang.toLowerCase().substr(0,2);
  var candidates = voices.filter(function(v){
    return v.lang && v.lang.toLowerCase().substr(0,2) === langPrefix;
  });
  if(!candidates.length) return null;
  function score(v){
    var s = 0;
    var name = (v.name||'').toLowerCase();
    var vlang = (v.lang||'').toLowerCase();
    if(vlang === lang.toLowerCase()) s += 100;
    // ສຳລັບພາສາຈີນ ໃຫ້ priority zh-CN ສູງສຸດ (ຈີນກາງ)
    if(langPrefix === 'zh'){
      if(vlang === 'zh-cn' || vlang === 'zh_cn') s += 80;
      else if(vlang.indexOf('zh-cn')>=0) s += 60;
      else if(vlang.indexOf('zh-tw')>=0) s += 20;
    }
    if(name.indexOf('natural')>=0) s += 50;
    if(name.indexOf('neural')>=0) s += 50;
    if(name.indexOf('premium')>=0) s += 45;
    if(name.indexOf('enhanced')>=0) s += 40;
    if(name.indexOf('online')>=0) s += 30;
    if(name.indexOf('google')>=0) s += 35;
    if(name.indexOf('microsoft')>=0) s += 30;
    if(name.indexOf('apple')>=0) s += 25;
    if(name.indexOf('female')>=0) s += 15;
    if(name.indexOf('woman')>=0) s += 15;
    // ຊື່ສຽງຜູ້ຍິງພາສາຈີນທີ່ຮູ້ຈັກ
    if(/(tingting|yating|sin-?ji|huihui|hanhan|xiaoxiao|xiaoyi|tracy|li-?mu|mei-?jia|yaoyao|kangkang)/i.test(v.name||'')) s += 12;
    if(/(samantha|karen|zira|aria|jenny|emma)/i.test(v.name||'')) s += 6;
    if(v.default) s += 3;
    return s;
  }
  candidates.sort(function(a,b){ return score(b) - score(a); });
  return candidates[0];
}

/* ດຶງເອົາສະເພາະຕົວອັກສອນຈີນ ຈາກຂໍ້ຄວາມ (ສຳລັບໃຫ້ TTS ອ່ານຊັດເຈນ) */
function extractChinese(text){
  if(!text) return text;
  var m = text.match(/[\\u4e00-\\u9fff]+/);
  return m ? m[0] : text;
}

var currentSpeakingEl = null;
function speak(text, lang, el){
  if(!soundOn) return;
  if(!('speechSynthesis' in window)) return;
  var voices = window.speechSynthesis.getVoices();
  if(!voices.length){
    setTimeout(function(){ speak(text, lang, el); }, 250);
    return;
  }

  if(el){ el.classList.add('speaking'); currentSpeakingEl = el; }

  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'zh-CN';
  var v = pickBestVoice(lang || 'zh-CN');
  if(v){ u.voice = v; u.lang = v.lang; }
  // ── ປັບໃຫ້ເດັກນ້ອຍຮຽນຟັງເຂົ້າໃຈ ──

  u.pitch = 1.15;  // pitch ສູງ ສຽງຄົມຕັດຫູ
  u.volume = 1.0;
  u.onend = function(){ if(el) el.classList.remove('speaking'); if(currentSpeakingEl === el) currentSpeakingEl = null; };
  u.onerror = function(){ if(el) el.classList.remove('speaking'); };
  setTimeout(function(){
    try{ window.speechSynthesis.speak(u); }catch(e){}
  }, 60);
}

var currentTopic = 'numbers';
function selectTopic(key){
  if(!topics[key]) return;
  currentTopic = key;
  document.querySelectorAll('.topic-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-topic') === key);
  });
  renderTopic();
}

function renderTopic(){
  var t = topics[currentTopic];
  document.getElementById('tt-ico').textContent = t.icon;
  document.getElementById('tt-text').textContent = t.title;
  document.getElementById('tt-sub').textContent = t.items.length + ' ຄຳ';
  var grid = document.getElementById('items-grid');
  grid.innerHTML = '';
  t.items.forEach(function(item){
    var card = document.createElement('div');
    card.className = 'item-card';
    if(t.isPinyin) card.classList.add('pinyin');
    if(item.bg){ card.style.background = item.bg; }
    if(item.fg){ card.style.color = item.fg; }
    var emojiEl = document.createElement('div');
    emojiEl.className = 'item-emoji';
    emojiEl.textContent = t.isPinyin ? item.pinyin : item.emoji;
    var cnEl = document.createElement('div');
    cnEl.className = 'item-cn';
    cnEl.textContent = item.cn;
    var pyEl = document.createElement('div');
    pyEl.className = 'item-pinyin';
    pyEl.textContent = item.py;
    var laoEl = document.createElement('div');
    laoEl.className = 'item-lao';
    laoEl.textContent = item.lao;
    card.appendChild(emojiEl);
    card.appendChild(cnEl);
    card.appendChild(pyEl);
    card.appendChild(laoEl);
    card.addEventListener('click', function(){
      var spokenText;
      if(t.isPinyin){
        // ສຳລັບ pinyin: ໃຫ້ TTS ອ່ານຕົວອັກສອນຈີນຈາກ cn (ຊັດເຈນກວ່າອ່ານ pinyin ດຽວ)
        // ເຊັ່ນ "爸 bà" → ອ່ານ "爸"; ສຳລັບ tones "妈 (ແມ່)" → ອ່ານ "妈"
        var cnChar = extractChinese(item.cn);
        // ສຳລັບ tones, ອ່ານ pinyin ກ່ອນ ແລະ tone ຈະຖືກອອກສຽງຖືກຕ້ອງ
        spokenText = cnChar || item.pinyin || item.cn;
      } else {
        spokenText = item.cn;
      }
      speak(spokenText, 'zh-CN', card);
    });
    grid.appendChild(card);
  });
}

renderTopic();

  } catch(e){}
  window.location.href = name + '.html';
}

<script>
/* === Sound on/off === */
var soundOn = true;
function toggleSound(){
  soundOn = !soundOn;
  var btn = document.getElementById('sound-btn');
  if(soundOn){ btn.textContent = '🔊'; btn.classList.remove('muted'); }
  else { btn.textContent = '🔇'; btn.classList.add('muted'); window.speechSynthesis.cancel(); }
}

/* === Menu === */
function toggleMenu(e){
  if(e) e.stopPropagation();
  var panel = document.getElementById('menu-panel');
  if(panel.classList.contains('show')){ closeMenu(); } else { openMenu(); }
}
function openMenu(){
  document.getElementById('menu-btn').classList.add('open');
  document.getElementById('menu-panel').classList.add('show');
  document.getElementById('menu-overlay').classList.add('show');
}
function closeMenu(){
  document.getElementById('menu-btn').classList.remove('open');
  document.getElementById('menu-panel').classList.remove('show');
  document.getElementById('menu-overlay').classList.remove('show');
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeMenu();
});

/* === TTS — ໃຊ້ສຽງໄທແທນ ເພາະພາສາລາວສຽງໃກ້ຄຽງ === */
var voicesReady = false;
function loadVoices(){
  var v = window.speechSynthesis.getVoices();
  voicesReady = v && v.length > 0;
}
if('speechSynthesis' in window){
  try{ window.speechSynthesis.getVoices(); }catch(e){}
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 500);
  setTimeout(loadVoices, 1500);
}

function pickBestVoice(lang){
  var voices = window.speechSynthesis.getVoices() || [];
  if(!voices.length) return null;
  var langPrefix = lang.toLowerCase().substr(0,2);
  var candidates = voices.filter(function(v){
    return v.lang && v.lang.toLowerCase().substr(0,2) === langPrefix;
  });
  if(!candidates.length) return null;
  function score(v){
    var s = 0;
    var name = (v.name||'').toLowerCase();
    if(v.lang.toLowerCase() === lang.toLowerCase()) s += 100;
    if(name.indexOf('natural')>=0) s += 50;
    if(name.indexOf('neural')>=0) s += 50;
    if(name.indexOf('premium')>=0) s += 45;

    if(/(premwadee|narisa|kanya|achara|niwat)/i.test(v.name||'')) s += 12;

  }
  candidates.sort(function(a,b){ return score(b) - score(a); });

}

var currentSpeakingEl = null;
function speak(text, el){
  if(!soundOn) return;
  if(!('speechSynthesis' in window)) return;
  var voices = window.speechSynthesis.getVoices();
  if(!voices.length){
    setTimeout(function(){ speak(text, el); }, 250);
    return;
  }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if(currentSpeakingEl){ currentSpeakingEl.classList.remove('speaking'); }
  if(el){ el.classList.add('speaking'); currentSpeakingEl = el; }

  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'th-TH';
  var v = pickBestVoice('th-TH');
  if(v){ u.voice = v; u.lang = v.lang; }
  u.rate = 0.78;   // ໄວປານກາງ ຟັງໄດ້ຊັດ
  u.pitch = 1.12;
  u.volume = 1.0;
  u.onend = function(){ if(el) el.classList.remove('speaking'); if(currentSpeakingEl === el) currentSpeakingEl = null; };
  u.onerror = function(){ if(el) el.classList.remove('speaking'); };
  setTimeout(function(){
    try{ window.speechSynthesis.speak(u); }catch(e){}
  }, 60);
}

  l1.innerHTML = '<span class="cl-num">1</span> ເລືອກພະຍັນຊະນະ';
  box.appendChild(l1);
  var consRow = document.createElement('div');
  consRow.className = 'combine-row';
  COMBINE_CONS.forEach(function(c){
    var btn = document.createElement('button');
    btn.className = 'chip cons-chip' + (c.compound ? ' cons-compound' : '');
    btn.textContent = c.lao;
    btn.setAttribute('data-key', c.lao);
    btn.onclick = function(){ selectCons(c, btn); };
    consRow.appendChild(btn);
  });
  box.appendChild(consRow);

  // Step 2: vowels
  var l2 = document.createElement('div');
  l2.className = 'combine-label';
  l2.innerHTML = '<span class="cl-num">2</span> ເລືອກສະຫຼະ';
  box.appendChild(l2);
  var vowRow = document.createElement('div');
  vowRow.className = 'combine-row';
  COMBINE_VOWELS.forEach(function(v){
    var btn = document.createElement('button');
    btn.className = 'chip vow-chip';
    btn.textContent = v.label;
    btn.setAttribute('data-key', v.key);
    btn.onclick = function(){ selectVow(v, btn); };
    vowRow.appendChild(btn);
  });
  box.appendChild(vowRow);

  // Step 3: tone marks (optional)
  var l3 = document.createElement('div');
  l3.className = 'combine-label';
  l3.innerHTML = '<span class="cl-num">3</span> ໃສ່ວັນນະຍຸດ <em class="cl-opt">(ຖ້າຕ້ອງການ)</em>';
  box.appendChild(l3);
  var toneRow = document.createElement('div');
  toneRow.className = 'combine-row';
  COMBINE_TONES.forEach(function(t){
    var btn = document.createElement('button');
    btn.className = 'chip tone-chip';
    btn.textContent = t.label;
    btn.setAttribute('data-key', t.key);
    btn.onclick = function(){ selectTone(t, btn); };
    toneRow.appendChild(btn);
  });
  box.appendChild(toneRow);

  // Step 4: final consonant (ຕົວສະກົດ) — optional
  var l4 = document.createElement('div');
  l4.className = 'combine-label';
  l4.innerHTML = '<span class="cl-num">4</span> ຕົວສະກົດ <em class="cl-opt">(ຖ້າຕ້ອງການ — ສຳລັບ ໄມ້ັ ໄມ້ົ ແລະ ອື່ນໆ)</em>';
  box.appendChild(l4);
  var finalRow = document.createElement('div');
  finalRow.className = 'combine-row';
  COMBINE_FINALS.forEach(function(f){
    var btn = document.createElement('button');
    btn.className = 'chip final-chip';
    btn.textContent = f.lao;
    btn.setAttribute('data-key', f.lao);
    btn.onclick = function(){ selectFinal(f, btn); };
    finalRow.appendChild(btn);
  });
  box.appendChild(finalRow);

  // Result display
  var result = document.createElement('div');
  result.className = 'combine-result';
  result.id = 'combine-result';
  box.appendChild(result);

  grid.appendChild(box);
  selectedCons = null; selectedVow = null; selectedTone = null; selectedFinal = null;
  wordBuffer = [];
  updateCombineResult();
}

function selectCons(c, btn){
  selectedCons = c;
  document.querySelectorAll('.cons-chip').forEach(function(b){
    b.classList.toggle('active', b === btn);
  });
  updateCombineResult();
  // ອ່ານສຽງພະຍັນຊະນະທັນທີ
  if(c){ speak(c.thai + 'อ', btn); }
}

function selectVow(v, btn){
  selectedVow = v;
  document.querySelectorAll('.vow-chip').forEach(function(b){
    b.classList.toggle('active', b === btn);
  });
  updateCombineResult();
  // ອ່ານສຽງສະຫຼະທັນທີ ໂດຍປະສົມກັບ ອ
  var thaiSyll = (v.thaiPre || '') + 'อ' + (v.thaiPost || '');
  speak(thaiSyll, btn);
}

function selectTone(t, btn){
  // ກົດຊ້ຳເພື່ອຍົກເລີກ
  if(selectedTone && selectedTone.key === t.key){
    selectedTone = null;
    btn.classList.remove('active');
  } else {
    selectedTone = t;
    document.querySelectorAll('.tone-chip').forEach(function(b){
      b.classList.toggle('active', b === btn);
    });
  }
  updateCombineResult();
}

function selectFinal(f, btn){
  // ກົດຊ້ຳເພື່ອຍົກເລີກ
  if(selectedFinal && selectedFinal.lao === f.lao){
    selectedFinal = null;
    btn.classList.remove('active');
  } else {
    selectedFinal = f;
    document.querySelectorAll('.final-chip').forEach(function(b){
      b.classList.toggle('active', b === btn);
    });
  }
  updateCombineResult();
  // ອ່ານສຽງສະກົດ
  if(selectedFinal){ speak('ตัว ' + f.thai, btn); }
}

function buildCurrentSyllable(){
  if(!selectedCons || !selectedVow) return null;
  var v = selectedVow, t = selectedTone, f = selectedFinal;
  // Lao Unicode order: pre + cons + mid(above-vowel) + tone + post + final
  var laoStr  = (v.laoPre  || '') + selectedCons.lao  + (v.laoMid  || '') + (t ? t.mark     : '') + (v.laoPost  || '') + (f ? f.lao  : '');
  var thaiStr = (v.thaiPre || '') + selectedCons.thai + (v.thaiMid || '') + (t ? t.thaiMark : '') + (v.thaiPost || '') + (f ? f.thai : '');
  return {lao: laoStr, thai: thaiStr};
}

function getWordLao(){
  return wordBuffer.map(function(s){ return s.lao; }).join('');
}
function getWordThai(){
  return wordBuffer.map(function(s){ return s.thai; }).join('');
}

function addSyllable(){
  var s = buildCurrentSyllable();
  if(!s) return;
  if(wordBuffer.length >= WORD_MAX) return;
  wordBuffer.push(s);
  // ລ້າງການເລືອກ ເພື່ອພ້ອມໃສ່ພະຍາງຕໍ່ໄປ
  selectedCons = null; selectedVow = null; selectedTone = null; selectedFinal = null;
  document.querySelectorAll('.cons-chip, .vow-chip, .tone-chip, .final-chip').forEach(function(b){
    b.classList.remove('active');
  });
  updateCombineResult();
  // ອ່ານພະຍາງທີ່ຫາກໍ່ເພີ່ມ
  speak(s.thai);
}

function popSyllable(){
  if(wordBuffer.length === 0) return;
  wordBuffer.pop();
  updateCombineResult();
}

function clearWord(){
  wordBuffer = [];
  selectedCons = null; selectedVow = null; selectedTone = null; selectedFinal = null;
  document.querySelectorAll('.cons-chip, .vow-chip, .tone-chip, .final-chip').forEach(function(b){
    b.classList.remove('active');
  });
  updateCombineResult();
}

function speakWord(){
  var thai = getWordThai();
  if(!thai) return;
  speak(thai);
}

function updateCombineResult(){
  var r = document.getElementById('combine-result');
  if(!r) return;
  r.innerHTML = '';
  var current = buildCurrentSyllable();

  // ຄຳສະສົມໃຫຍ່ — ຖ້າມີ
  if(wordBuffer.length > 0){
    var wordRow = document.createElement('div');
    wordRow.className = 'cr-word';
    wordRow.textContent = getWordLao();
    r.appendChild(wordRow);
    var wordSub = document.createElement('div');
    wordSub.className = 'cr-wordsub';
    wordSub.textContent = wordBuffer.length + ' / ' + WORD_MAX + ' ພະຍາງ';
    r.appendChild(wordSub);
  }

  // ພະຍາງປະຈຸບັນ (ກຳລັງສ້າງ) ຫຼື hint
  var preview = document.createElement('div');
  preview.className = 'cr-preview';
  if(current){
    preview.innerHTML = '<span class="cr-prev-label">ພະຍາງປະຈຸບັນ:</span> <span class="cr-prev-text">' + current.lao + '</span>';
  } else if(wordBuffer.length === 0){
    preview.innerHTML = '<span class="cr-hint">👇 ກົດເລືອກພະຍັນຊະນະ ແລະ ສະຫຼະ</span>';
  } else if(!selectedCons){
    preview.innerHTML = '<span class="cr-hint">⬆️ ເລືອກພະຍັນຊະນະ ເພື່ອເພີ່ມພະຍາງ</span>';
  } else {
    preview.innerHTML = '<span class="cr-hint">⬆️ ເລືອກສະຫຼະ ເພື່ອເພີ່ມພະຍາງ</span>';
  }
  r.appendChild(preview);

  // ປຸ່ມ ➕ ⌫ ✕
  var btnRow = document.createElement('div');
  btnRow.className = 'cr-btnrow';

  var addBtn = document.createElement('button');
  addBtn.className = 'cr-btn cr-add';
  addBtn.textContent = '➕ ເພີ່ມພະຍາງ';
  addBtn.disabled = !current || wordBuffer.length >= WORD_MAX;
  addBtn.onclick = addSyllable;
  btnRow.appendChild(addBtn);

  var popBtn = document.createElement('button');
  popBtn.className = 'cr-btn cr-pop';
  popBtn.textContent = '⌫ ລົບ';
  popBtn.disabled = wordBuffer.length === 0;
  popBtn.onclick = popSyllable;
  btnRow.appendChild(popBtn);

  var clrBtn = document.createElement('button');
  clrBtn.className = 'cr-btn cr-clr';
  clrBtn.textContent = '✕ ລ້າງ';
  clrBtn.disabled = wordBuffer.length === 0 && !current;
  clrBtn.onclick = clearWord;
  btnRow.appendChild(clrBtn);
  r.appendChild(btnRow);

  // ປຸ່ມຟັງສຽງໃຫຍ່ — ຄຳສະສົມ ຫຼື ພະຍາງປະຈຸບັນ
  var speakBtn = document.createElement('button');
  speakBtn.className = 'cr-speak';
  if(wordBuffer.length > 0){
    speakBtn.textContent = '🔊 ກົດຟັງສຽງຄຳ';
    speakBtn.onclick = function(){ speak(getWordThai(), speakBtn); };
  } else if(current){
    speakBtn.textContent = '🔊 ກົດຟັງສຽງພະຍາງ';
    speakBtn.onclick = function(){ speak(current.thai, speakBtn); };
  } else {
    speakBtn.textContent = '🔊 ເລືອກກ່ອນ';
    speakBtn.disabled = true;
  }
  r.appendChild(speakBtn);
}

var currentTopic = 'consonants';
function selectTopic(key){
  if(!topics[key]) return;
  currentTopic = key;
  document.querySelectorAll('.topic-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-topic') === key);
  });
  renderTopic();
}

function renderTopic(){
  var t = topics[currentTopic];
  document.getElementById('tt-ico').textContent = t.icon;
  document.getElementById('tt-text').textContent = t.title;
  var grid = document.getElementById('items-grid');
  grid.classList.toggle('vowels', !!t.isVowels);
  grid.classList.toggle('numbers', !!t.isNumbers);
  grid.classList.toggle('tones', !!t.isTones);
  grid.classList.toggle('with-emoji', !!t.hasEmoji);
  grid.classList.toggle('combine', !!t.isCombine);
  if(t.isCombine){
    document.getElementById('tt-sub').textContent = '27 × 16 = ປະສົມສຽງ';
    renderCombineUI(grid);
    return;
  }
  document.getElementById('tt-sub').textContent = t.items.length + ' ' + (t.subKey || 'ໂຕ');
  grid.innerHTML = '';
  t.items.forEach(function(item){
    var card = document.createElement('div');
    card.className = 'item-card';
    // ໂຕອັກສອນ + ຮູບປະກອບ ໃຫ້ເດັກສັງເກດງ່າຍ
    if(t.hasEmoji && item.emoji){
      var topRow = document.createElement('div');
      topRow.className = 'item-top';
      var letterEl = document.createElement('span');
      letterEl.className = 'item-letter';
      letterEl.textContent = item.lao;
      var emojiEl = document.createElement('span');
      emojiEl.className = 'item-pic';
      // ຮອງຮັບ SVG inline (ສຳລັບທຸງຊາດ ແລະ ຮູບສະເພາະອື່ນໆ)
      if(item.emoji.indexOf('<svg') === 0){
        emojiEl.classList.add('item-pic-svg');
        emojiEl.innerHTML = item.emoji;
      } else {
        emojiEl.textContent = item.emoji;
      }
      topRow.appendChild(letterEl);
      topRow.appendChild(emojiEl);
      card.appendChild(topRow);
    } else {
      var letterEl = document.createElement('div');
      letterEl.className = 'item-letter';
      letterEl.textContent = item.lao;
      card.appendChild(letterEl);
    }
    var wordEl = document.createElement('div');
    wordEl.className = 'item-word';
    wordEl.textContent = item.word;
    var meaningEl = document.createElement('div');
    meaningEl.className = 'item-meaning';
    meaningEl.textContent = item.meaning;
    card.appendChild(wordEl);
    card.appendChild(meaningEl);
    card.addEventListener('click', function(){
      speak(item.spoken, card);
    });
    grid.appendChild(card);
  });
}

renderTopic();

const loaded = { math: false, english: false, chinese: false, lao: false };

function loadFrame(name){
  if(loaded[name]) return;
  const frame = document.getElementById('frame-' + name);
  frame.srcdoc = FRAMES_HTML[name];
  loaded[name] = true;
}

function showView(name){
  if(!FRAMES_HTML[name]) return;
  loadFrame(name);
  document.querySelectorAll('.view-frame').forEach(f => f.classList.remove('active'));
  document.getElementById('frame-' + name).classList.add('active');
  document.getElementById('picker').classList.add('hidden');
  try{ localStorage.setItem('lastView', name); }catch(e){}
  // ຫຍຸດສຽງເກົ່າທີ່ກຳລັງເວົ້າຢູ່ໃນ frame ອື່ນ
  ['math','english','chinese','lao'].forEach(n => {
    if(n !== name){
      const f = document.getElementById('frame-' + n);
      try{ if(f.contentWindow && f.contentWindow.speechSynthesis) f.contentWindow.speechSynthesis.cancel(); }catch(e){}
    }
  });
}

function showPicker(){
  document.querySelectorAll('.view-frame').forEach(f => f.classList.remove('active'));
  document.getElementById('picker').classList.remove('hidden');
  // ຫຍຸດສຽງທຸກ frame
  ['math','english','chinese','lao'].forEach(n => {
    const f = document.getElementById('frame-' + n);
    try{ if(f.contentWindow && f.contentWindow.speechSynthesis) f.contentWindow.speechSynthesis.cancel(); }catch(e){}
  });
}

window.addEventListener('message', (e) => {
  if(e.data && e.data.type === 'switchView' && e.data.view){
    if(e.data.view === 'home' || e.data.view === 'picker'){
      showPicker();
    } else {
      showView(e.data.view);
    }
  }
});

</script>
