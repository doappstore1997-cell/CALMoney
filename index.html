<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ກະຕຸນໂຄໂລມິ ສອນເລກ - ປັບປຸງໃໝ່</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;min-height:100vh;font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#FFF0F8 0%,#EDE9FE 100%);overflow-x:hidden;}
.wrap{max-width:460px;margin:0 auto;padding:10px 12px 40px;display:flex;flex-direction:column;align-items:center;gap:12px;}

/* HEADER */
.hdr{width:100%;display:flex;align-items:center;justify-content:space-between;background:white;border-radius:22px;padding:10px 16px;box-shadow:0 4px 20px rgba(168,85,247,0.15);}
.hdr-title{font-size:14px;font-weight:900;color:#7C3AED;}
.score-pill{display:flex;align-items:center;gap:5px;background:#EDE9FE;border-radius:50px;padding:6px 14px;font-size:18px;font-weight:900;color:#7C3AED;}

/* LANGUAGE SELECTOR */
.lang-box{width:100%;display:flex;justify-content:center;gap:8px;margin-bottom:5px;}
.lang-btn{padding:8px 12px;border:2px solid #E5E7EB;border-radius:12px;background:white;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;}
.lang-btn.active{background:#7C3AED;color:white;border-color:#7C3AED;box-shadow:0 4px 10px rgba(124,58,237,0.3);}

/* MODE TABS */
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;}
.mode-btn{padding:10px 4px;border:3px solid transparent;border-radius:16px;background:white;font-size:20px;font-weight:900;cursor:pointer;text-align:center;transition:all .2s;box-shadow:0 3px 10px rgba(0,0,0,0.08);color:#9CA3AF;line-height:1.2;}
.mode-btn span{display:block;font-size:11px;margin-top:2px;}
.mode-btn.active{border-color:#FF6B9D;background:#FFF0F8;color:#FF6B9D;transform:translateY(-2px);box-shadow:0 6px 18px rgba(255,107,157,.28);}

/* CHARACTER */
.char-area{position:relative;display:flex;flex-direction:column;align-items:center;}
.kolo-wrap{position:relative;width:150px;height:150px;cursor:pointer;}
.kolo{width:100%;height:100%;animation:bob 2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
.bubble{position:absolute;top:-10px;right:-55px;background:white;border-radius:18px;padding:8px 12px;font-size:12px;font-weight:700;color:#1F2937;box-shadow:0 4px 16px rgba(0,0,0,.13);max-width:110px;text-align:center;opacity:0;transform:scale(.5);transition:all .3s cubic-bezier(.175,.885,.32,1.275);z-index:10;}
.bubble.show{opacity:1;transform:scale(1);}

/* SOUND BTN */
.sound-btn{width:100%;padding:14px;font-size:18px;font-weight:900;border:3px solid #BAE6FD;border-radius:20px;background:#F0F9FF;color:#0369A1;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 3px 12px rgba(3,105,161,.12);}
.sound-btn.playing{animation:pulse 0.8s infinite alternate;}
@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.02);box-shadow:0 0 15px rgba(59,130,246,0.3);}}

.emo-box{background:white;border-radius:20px;padding:12px;width:100%;min-height:60px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;font-size:24px;box-shadow:0 3px 12px rgba(0,0,0,.07);}
.q-card{background:white;border-radius:26px;padding:15px;width:100%;text-align:center;box-shadow:0 6px 28px rgba(124,58,237,.13);border:3px solid #EDE9FE;}
.q-text{font-size:42px;font-weight:900;color:#2D1B69;}

.lvl-row{width:100%;display:flex;align-items:center;gap:10px;padding:5px;}
.lvl-row input[type=range]{flex:1;accent-color:#7C3AED;}

.ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;}
.ans-btn{padding:18px 8px;font-size:34px;font-weight:900;border:3px solid #E5E7EB;border-radius:22px;background:white;cursor:pointer;transition:all .18s;}
.ans-btn.correct{background:#D1FAE5;border-color:#34D399;color:#065F46;}
.ans-btn.wrong{background:#FEE2E2;border-color:#F87171;color:#991B1B;}

.next-btn{width:100%;padding:18px;font-size:20px;font-weight:900;border:none;border-radius:24px;background:linear-gradient(135deg,#FF6B9D 0%,#7C3AED 100%);color:white;cursor:pointer;display:none;box-shadow:0 6px 24px rgba(124,58,237,.35);}

.loading{width:16px;height:16px;border:3px solid #3B82F6;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="wrap">
    <div class="hdr">
    <div class="hdr-title">🎀 ໂຄໂລມິ ສອນເລກ</div>
    <div class="score-pill">⭐ <span id="score">0</span></div>
  </div>

    <div class="lang-box">
    <button class="lang-btn active" onclick="setLang('lo-LA')">🇱🇦 ລາວ</button>
    <button class="lang-btn" onclick="setLang('th-TH')">🇹🇭 ไทย</button>
    <button class="lang-btn" onclick="setLang('en-US')">🇺🇸 Eng</button>
    <button class="lang-btn" onclick="setLang('zh-CN')">🇨🇳 中文</button>
  </div>

    <div class="modes">
    <button class="mode-btn active" onclick="setMode('add')">➕<span>ບວກ</span></button>
    <button class="mode-btn" onclick="setMode('sub')">➖<span>ລົບ</span></button>
    <button class="mode-btn" onclick="setMode('mul')">✖<span>ຄູນ</span></button>
    <button class="mode-btn" onclick="setMode('div')">➗<span>ຫານ</span></button>
  </div>

    <div class="char-area">
    <div class="kolo-wrap" onclick="koloTap()">
      <div class="kolo" id="kolo">
        <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="55" cy="38" rx="14" ry="30" fill="#F9A8D4" transform="rotate(-12,55,38)"/>
          <ellipse cx="105" cy="38" rx="14" ry="30" fill="#F9A8D4" transform="rotate(12,105,38)"/>
          <ellipse cx="80" cy="82" rx="40" ry="36" fill="#FDF2F8"/>
          <g id="en"><circle cx="69" cy="79" r="4.5" fill="#2D1B69"/><circle cx="93" cy="79" r="4.5" fill="#2D1B69"/></g>
          <g id="eh" style="display:none"><path d="M62 78 Q68 70 74 78" stroke="#2D1B69" stroke-width="3" fill="none"/><path d="M86 78 Q92 70 98 78" stroke="#2D1B69" stroke-width="3" fill="none"/></g>
          <g id="es" style="display:none"><circle cx="68" cy="82" r="4" fill="#2D1B69"/><circle cx="92" cy="82" r="4" fill="#2D1B69"/></g>
          <ellipse cx="80" cy="90" rx="5" ry="3.5" fill="#F472B6"/>
          <path id="mn" d="M74 96 Q80 102 86 96" stroke="#C026D3" stroke-width="2.5" fill="none"/>
          <ellipse cx="80" cy="130" rx="30" ry="22" fill="#F9A8D4"/>
        </svg>
      </div>
      <div class="bubble" id="bubble"></div>
    </div>
  </div>

    <button class="sound-btn" id="sound-btn" onclick="playCurrentVoice()">
    🔊 <span id="sound-label">ກົດຟັງໂຈດ!</span>
  </button>

    <div class="emo-box" id="emo-box"></div>

    <div class="lvl-row">
    <input type="range" min="1" max="3" value="1" step="1" id="lvl" oninput="setLevel(this.value)">
    <div style="font-weight:900; color:#7C3AED; font-size:13px;" id="lvl-label">ງ່າຍ 🌱</div>
  </div>

    <div class="q-card">
    <div class="q-text" id="q-text">? + ?</div>
  </div>

    <div class="ans-grid" id="ans-grid"></div>

    <button class="next-btn" id="next-btn" onclick="nextQ()">ຂໍ້ຕໍ່ໄປ ▶</button>
</div>

<script>
var mode='add', level=1, score=0, currentLang='lo-LA';
var correctAns=0, answered=false, currentText='', ttsRate=0.6; // 0.6 is SLOW for kids

// Phrases in different languages
var translations = {
  'lo-LA': { plus:'ບວກ', minus:'ລົບ', times:'ຄູນ', div:'ຫານ', equal:'ເທົ່າກັບ', what:'ແມ່ນຫຍັງ', correct:'ເກັ່ງຫຼາຍ ຖືກຕ້ອງແລ້ວ', wrong:'ບໍ່ຖືກ ລອງໃໝ່ເດີ', tap:'ສູ້ໆເດີ' },
  'th-TH': { plus:'บวก', minus:'ลบ', times:'คูณ', div:'หาร', equal:'เท่ากับ', what:'อะไรคะ', correct:'เก่งมากค่ะ ถูกต้องแล้ว', wrong:'ยังไม่ถูก ลองใหม่นะ', tap:'สู้ๆ นะคะ' },
  'en-US': { plus:'plus', minus:'minus', times:'times', div:'divided by', equal:'is', what:'what', correct:'Excellent! That is right', wrong:'Not quite, try again', tap:'You can do it' },
  'zh-CN': { plus:'加', minus:'减', times:'乘', div:'除以', equal:'等于', what:'多少', correct:'太棒了！答对了', wrong:'不对，再试一次', tap:'加油' }
};

function setLang(lang){
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick').includes(lang));
  });
  nextQ();
}

function playVoice(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  
  var utter = new SpeechSynthesisUtterance(text);
  var voices = window.speechSynthesis.getVoices();
  
  // Find best voice matching currentLang
  var voice = voices.find(v => v.lang.replace('_','-') === currentLang);
  if(!voice) voice = voices.find(v => v.lang.startsWith(currentLang.split('-')[0]));
  
  utter.voice = voice;
  utter.rate = ttsRate; // SLOW RATE
  utter.pitch = 1.3;
  
  utter.onstart = () => document.getElementById('sound-btn').classList.add('playing');
  utter.onend = () => document.getElementById('sound-btn').classList.remove('playing');
  
  window.speechSynthesis.speak(utter);
}

function playCurrentVoice(){ playVoice(currentText); }

function nextQ(){
  answered = false;
  document.getElementById('next-btn').style.display = 'none';
  face('normal');
  
  // Generate numbers
  var a, b, sym;
  if(mode==='add'){ a=rnd(1,level*5); b=rnd(1,level*5); correctAns=a+b; sym='+'; }
  else if(mode==='sub'){ b=rnd(1,level*5); a=b+rnd(0,5); correctAns=a-b; sym='-'; }
  else if(mode==='mul'){ a=rnd(1,level+1); b=rnd(1,5); correctAns=a*b; sym='×'; }
  else { b=rnd(1,5); correctAns=rnd(1,5); a=b*correctAns; sym='÷'; }

  // Set Voice Text
  var t = translations[currentLang];
  var symWord = sym==='+'?t.plus : sym==='-'?t.minus : sym==='×'?t.times : t.div;
  currentText = `${a} ${symWord} ${b} ${t.equal} ${t.what}`;

  document.getElementById('q-text').textContent = `${a} ${sym} ${b} = ?`;
  
  // Visual aids (Emojis)
  var eb = document.getElementById('emo-box');
  eb.innerHTML = '🍓'.repeat(Math.min(a,10)) + (sym==='+'?' ➕ ':'') + (sym==='+'?'🍓'.repeat(Math.min(b,10)):'');

  // Choices
  var choices = [correctAns];
  while(choices.length < 4){
    var c = correctAns + rnd(-3, 3);
    if(c>=0 && !choices.includes(c)) choices.push(c);
  }
  choices.sort(() => Math.random() - 0.5);

  var grid = document.getElementById('ans-grid');
  grid.innerHTML = '';
  choices.forEach(c => {
    var btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.textContent = c;
    btn.onclick = () => checkAns(c, btn);
    grid.appendChild(btn);
  });

  playVoice(currentText);
}

function checkAns(val, btn){
  if(answered) return;
  answered = true;
  var ok = (val === correctAns);
  var t = translations[currentLang];

  if(ok){
    score += 10;
    document.getElementById('score').textContent = score;
    btn.classList.add('correct');
    face('happy');
    playVoice(t.correct);
  } else {
    btn.classList.add('wrong');
    face('sad');
    playVoice(t.wrong);
    // Highlight correct one
    Array.from(document.querySelectorAll('.ans-btn')).forEach(b => {
      if(parseInt(b.textContent) === correctAns) b.classList.add('correct');
    });
  }
  document.getElementById('next-btn').style.display = 'block';
}

function face(st){
  document.getElementById('en').style.display = st==='normal'?'':'none';
  document.getElementById('eh').style.display = st==='happy'?'':'none';
  document.getElementById('es').style.display = st==='sad'?'':'none';
}

function rnd(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

function setMode(m){ mode=m; document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('active', ['add','sub','mul','div'][i]===m)); nextQ(); }

function setLevel(v){ level=parseInt(v); var lbls={1:'ງ່າຍ 🌱',2:'ກາງ 🌿',3:'ຍາກ 🌳'}; document.getElementById('lvl-label').textContent=lbls[level]; nextQ(); }

function koloTap(){ 
  var t = translations[currentLang].tap;
  var b = document.getElementById('bubble');
  b.textContent = t; b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'), 2000);
  playVoice(t);
}

// Init
window.speechSynthesis.onvoiceschanged = () => { if(!currentText) nextQ(); };
window.onload = () => { setTimeout(nextQ, 500); };
</script>
</body>
</html>
