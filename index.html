// ── Helper: ສ້າງສ່ວນປະກອບສົມຜົນ (ປ້ອງກັນຕົກແຖວ) ──
function makeIconNum(emoji, num, extraClass){
  var span=document.createElement('span');
  span.className='q-iconnum'+(extraClass?' '+extraClass:'');
  var em=document.createElement('span');
  em.className='q-emoji'; em.textContent=emoji;
  var n=document.createElement('span');
  n.className='q-num'; n.textContent=num;
  span.appendChild(em); span.appendChild(n);
  return span;
}
function makeOp(text){
  var s=document.createElement('span');
  s.className='q-op'; s.textContent=text;
  return s;
}
function makePlain(text, extra){
  var s=document.createElement('span');
  s.className='q-plain'+(extra?' '+extra:'');
  s.textContent=text;
  return s;
}

// ── ສ້າງສົມຜົນເປັນ DOM nodes (flex layout, ບໍ່ຕົກແຖວ) ──
function renderQuestion(q){
  var qEl=document.getElementById('question');
  qEl.innerHTML='';
  if(mode==='add'){
    qEl.appendChild(makeIconNum(q.charA, q.a));
    qEl.appendChild(makeOp(q.sym));
    qEl.appendChild(makeIconNum(q.charB, q.b));
  } else if(mode==='mul'){
    qEl.appendChild(makeIconNum('📦', q.a, 'q-box'));
    qEl.appendChild(makeOp(q.sym));
    qEl.appendChild(makeIconNum(currentChar, q.b));
  } else if(mode==='div'){
    qEl.appendChild(makeIconNum(currentChar, q.a));
    qEl.appendChild(makeOp(q.sym));
    qEl.appendChild(makeIconNum('🧺', q.b, 'q-basket'));
  } else {
    // ການລົບ: ໃຊ້ເລກທຳມະດາ
    qEl.appendChild(makePlain(q.a));
    qEl.appendChild(makeOp(q.sym));
    qEl.appendChild(makePlain(q.b));
  }
  qEl.appendChild(makeOp('='));
  qEl.appendChild(makePlain('?', 'q-result'));
}

function pickTwoDifferent(){
  var arr=MODE_CHARS[mode];
  var a=arr[randInt(0,arr.length-1)];
  var b=arr[randInt(0,arr.length-1)];
  var att=0;
  while(b===a && att<15 && arr.length>1){
    b=arr[randInt(0,arr.length-1)];
    att++;
  }
  return [a,b];
}

function generateQuestion(){
  var a,b,ans,sym,chars='';
  currentChar=pickChar();
  var ch=currentChar;
  var charA=ch, charB=ch; // ຄ່າຕັ້ງຕົ້ນສຳລັບ mode ອື່ນ
  if(mode==='add'){
    if(level===1){a=randInt(1,5);b=randInt(1,5);}
    else if(level===2){a=randInt(1,12);b=randInt(1,12);}
    else{a=randInt(1,30);b=randInt(1,30);}
    ans=a+b; sym='+';
    // ໃຊ້ໂຕສັດ 2 ໂຕທີ່ແຕກຕ່າງກັນສຳລັບແຕ່ລະເບື້ອງ
    var pair=pickTwoDifferent();
    charA=pair[0]; charB=pair[1];
    if(level===1) chars=charA.repeat(Math.min(a,6))+'  ➕  '+charB.repeat(Math.min(b,6));
  } else if(mode==='sub'){
    if(level===1){b=randInt(1,4);a=randInt(b,8);}
    else if(level===2){b=randInt(1,10);a=randInt(b,18);}
    else{b=randInt(1,20);a=randInt(b,40);}
    ans=a-b; sym='−';
  } else if(mode==='mul'){
    // ລະດັບງ່າຍ: 1-3 × 1-4  (ໃຊ້ຮູບກຸ່ມ ສອນຄວາມໝາຍ "ກຸ່ມລະ")
    // ລະດັບກາງ: 1-5 × 1-5  (ຍັງມີຮູບ ແຕ່ໃຫຍ່ຂຶ້ນ)
    // ລະດັບຍາກ: 2-12 × 2-12 (ບໍ່ມີຮູບ - ຄິດໃນຫົວ)
    if(level===1){a=randInt(1,3);b=randInt(1,4);}
    else if(level===2){a=randInt(1,5);b=randInt(1,5);}
    else{a=randInt(2,12);b=randInt(2,12);}
    ans=a*b; sym='×';
  } else {
    // ຫານ: ສ້າງຈາກ ans × b ກ່ອນ ເພື່ອໃຫ້ໄດ້ຄຳຕອບເປັນຈຳນວນເຕັມສະເໝີ
    // ລະດັບງ່າຍ: ແບ່ງເປັນ 2-3 ກຸ່ມ, ກຸ່ມລະ 1-4 ໂຕ
    // ລະດັບກາງ: ແບ່ງເປັນ 2-5 ກຸ່ມ, ກຸ່ມລະ 1-5 ໂຕ
    // ລະດັບຍາກ: ບໍ່ມີຮູບ
    if(level===1){b=randInt(2,3);ans=randInt(1,4);}
    else if(level===2){b=randInt(2,5);ans=randInt(1,5);}
    else{b=randInt(2,12);ans=randInt(2,12);}
    a=b*ans; sym='÷';
  }
  return{a:a,b:b,ans:ans,sym:sym,chars:chars,charA:charA,charB:charB};
}

function makeChoices(c){
  var ch=[c],att=0,range=Math.max(4,Math.round(c*0.5));
  while(ch.length<4&&att<80){att++;var x=c+randInt(-range,range);if(x>=0&&!ch.includes(x))ch.push(x);}
  while(ch.length<4){var e=c+ch.length+1;if(!ch.includes(e))ch.push(e);}
  return ch.sort(function(){return Math.random()-0.5;});
}

// ── Sub interactive grid (ten-frame style: ກຸ່ມລະ 5, ແຖວລະ 10) ──
function buildSubGrid(a,b){
  subB=b; crossedCount=0;
  var grid=document.getElementById('char-grid');
  grid.innerHTML='';
  // ໂຕໃຫຍ່ຂຶ້ນເມື່ອຫນ້ອຍ, ນ້ອຍລົງເລັກນ້ອຍເມື່ອຫຼາຍ - ແຕ່ຍັງຊັດເຈນ
  if(a > 10) grid.classList.add('many');
  else grid.classList.remove('many');
  var ch=currentChar;
  var show=Math.min(a,20);
  for(var i=0;i<show;i++){
    (function(idx){
      // ຂຶ້ນແຖວໃໝ່ທຸກ 10 ໂຕ (ten-frame)
      if(idx > 0 && idx % 10 === 0){
        var br=document.createElement('div');
        br.className='char-break';
        grid.appendChild(br);
      } else if(idx > 0 && idx % 5 === 0){
        // ເຄົາະຊ່ອງລະຫວ່າງກຸ່ມ 5 ໃນແຖວດຽວກັນ
        var sep=document.createElement('span');
        sep.className='char-sep5';
        grid.appendChild(sep);
      }
      var sp=document.createElement('span');
      sp.className='char-item tappable';
      sp.textContent=ch;
      var tapFn=function(e){
        e.preventDefault();
        if(answered)return;
        if(!sp.classList.contains('crossed')){
          if(crossedCount>=subB){
            // wiggle counter
            var sc=document.getElementById('sub-counter');
            sc.style.transform='scale(1.15)';
            setTimeout(function(){sc.style.transform='';},200);
            return;
          }
          sp.classList.add('crossed');
          crossedCount++;
        } else {
          sp.classList.remove('crossed');
          crossedCount--;
        }
        refreshSubCounter();
      };
      sp.addEventListener('click',tapFn);
      sp.addEventListener('touchend',tapFn);
      grid.appendChild(sp);
    })(i);
  }
  refreshSubCounter();
  document.getElementById('sub-hint-n').textContent=b;
}

// Helper: ສ້າງກຸ່ມ emoji ໃສ່ parent ພ້ອມ separator ທຸກ 5 ໂຕ
function appendEmojiGroup(parent, ch, n, itemClass, sepClass){
  for(var i=0; i<n; i++){
    if(i>0 && i%5===0){
      var sep=document.createElement('span');
      sep.className=sepClass;
      parent.appendChild(sep);
    }
    var em=document.createElement('span');
    em.className=itemClass;
    em.textContent=ch;
    parent.appendChild(em);
  }
}

function refreshSubCounter(){
  var sc=document.getElementById('sub-counter');
  sc.textContent='❌ ຂີດຂ້າ: '+crossedCount+' / '+subB;
  if(crossedCount===subB){
    sc.classList.add('done');
  } else {
    sc.classList.remove('done');
  }
}

// ── ການຄູນ: ສະແດງເປັນ "ກຸ່ມ" ──
// ແນວຄິດ: a × b ໝາຍຄວາມວ່າ "ມີ a ກຸ່ມ, ກຸ່ມລະ b ໂຕ"
// ເດັກນັບລວມທັງໝົດເພື່ອຫາຄຳຕອບ
function buildMulGroups(a,b,ch){
  var area=document.getElementById('group-area');
  var hint=document.getElementById('group-hint');
  area.innerHTML='';
  for(var i=0;i<a;i++){
    var box=document.createElement('div');
    box.className='group-box group-box-mul';
    var c=groupColors[i%groupColors.length];
    box.style.background=c.bg;
    box.style.borderColor=c.bd;
    box.style.animationDelay=(i*0.08)+'s';
    // ປ້າຍ "📦" ເທິງກ່ອງ ໃຫ້ກົງກັບສັນຍາລັກໃນສົມຜົນ
    var lbl=document.createElement('span');
    lbl.className='gb-label';
    lbl.textContent='📦 '+(i+1);
    box.appendChild(lbl);
    var items=document.createTextNode(ch.repeat(b));
    box.appendChild(items);
    area.appendChild(box);
    if(i<a-1){
      var sep=document.createElement('span');
      sep.className='group-sep';
      sep.textContent='+';
      sep.style.animationDelay=(i*0.08+0.04)+'s';
      area.appendChild(sep);
    }
  }
  hint.innerHTML='📦 <b>'+a+'</b> ກ່ອງ, ກ່ອງລະ '+ch+' <b>'+b+'</b> ໂຕ → ນັບລວມທັງໝົດເທົ່າໃດ?';
}

// ── ການຫານ: ສະແດງເປັນ "ການແບ່ງເທົ່າກັນ" ──
// ແນວຄິດ: a ÷ b ໝາຍຄວາມວ່າ "ແບ່ງ a ໂຕ ໃສ່ b ກຸ່ມເທົ່າໆກັນ → ກຸ່ມລະຈັກໂຕ?"
// ສະແດງກ່ອງ b ກ່ອງ ແຕ່ລະກ່ອງມີ ans ໂຕ - ເດັກນັບກຸ່ມດຽວເພື່ອຫາຄຳຕອບ
function buildDivGroups(a,b,ans,ch){
  var area=document.getElementById('group-area');
  var hint=document.getElementById('group-hint');
  area.innerHTML='';
  for(var i=0;i<b;i++){
    var box=document.createElement('div');
    box.className='group-box group-box-div';
    var c=groupColors[i%groupColors.length];
    box.style.background=c.bg;
    box.style.borderColor=c.bd;
    box.style.animationDelay=(i*0.1)+'s';
    // ປ້າຍ "🧺" ເທິງກ່ອງ ໃຫ້ກົງກັບສັນຍາລັກໃນສົມຜົນ
    var lbl=document.createElement('span');
    lbl.className='gb-label';
    lbl.textContent='🧺 '+(i+1);
    box.appendChild(lbl);
    var items=document.createTextNode(ch.repeat(ans));
    box.appendChild(items);
    area.appendChild(box);
  }
  hint.innerHTML='ແບ່ງ '+ch+' <b>'+a+'</b> ໂຕ ໃສ່ 🧺 <b>'+b+'</b> ກະຕ່າເທົ່າໆກັນ → ກະຕ່າລະຈັກໂຕ?';
}

// ── Next question ──
function nextQuestion(){
  answered=false; crossedCount=0; subB=0;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('stars').textContent='';
  document.getElementById('next-btn').style.display='none';

  var q=generateQuestion();
  correctAnswer=q.ans;
  currentQ=q;
  renderQuestion(q);

  var isSubVis=(mode==='sub'&&level<=2);
  var isMulVis=(mode==='mul'&&level<=2);
  var isDivVis=(mode==='div'&&level<=2);
  var isAddVis=(mode==='add'&&level===1);

  // ສະແດງ/ເຊື່ອງ ຮູບປະກອບແຕ່ລະປະເພດ
  document.getElementById('sub-hint').style.display    = isSubVis?'block':'none';
  document.getElementById('char-grid').style.display   = isSubVis?'flex':'none';
  document.getElementById('sub-counter').style.display = isSubVis?'block':'none';

  document.getElementById('group-hint').style.display  = (isMulVis||isDivVis)?'inline-block':'none';
  document.getElementById('group-area').style.display  = (isMulVis||isDivVis)?'flex':'none';

  document.getElementById('character-row').style.display = isAddVis?'flex':'none';

  if(isSubVis){
    buildSubGrid(q.a,q.b);
  } else if(isMulVis){
    buildMulGroups(q.a,q.b,currentChar);
  } else if(isDivVis){
    buildDivGroups(q.a,q.b,q.ans,currentChar);
  } else if(isAddVis){
    // ສະແດງ emoji ສຳລັບ a + b ໂດຍແບ່ງເປັນກຸ່ມ 5 ເພື່ອງ່າຍຕໍ່ການນັບ
    var row=document.getElementById('character-row');
    row.innerHTML='';
    var showA=Math.min(q.a,10), showB=Math.min(q.b,10);
    appendEmojiGroup(row, q.charA, showA, 'add-emoji', 'add-sep5');
    var plus=document.createElement('span');
    plus.className='add-plus';
    plus.textContent='➕';
    row.appendChild(plus);
    appendEmojiGroup(row, q.charB, showB, 'add-emoji', 'add-sep5');
  }

  if(level<=2){
    document.getElementById('answer-grid').style.display='grid';
    document.getElementById('input-row').style.display='none';
    var choices=makeChoices(q.ans);
    var grid=document.getElementById('answer-grid');
    grid.innerHTML='';
    choices.forEach(function(c){
      var btn=document.createElement('button');
      btn.className='ans-btn'; btn.textContent=c;
      btn.onclick=function(){checkAnswer(c,btn);};
      grid.appendChild(btn);
    });
  } else {
    document.getElementById('answer-grid').style.display='none';
    document.getElementById('input-row').style.display='flex';
    var inp=document.getElementById('ans-input');
    inp.value=''; inp.style.borderColor='';
    setTimeout(function(){inp.focus();},100);
  }
}

// ── Core check logic ──
function applyResult(ok){
  totalCount++;
  document.getElementById('total-count').textContent=totalCount;
  var pts=0;
  if(ok){
    correctCount++; streak++;
    stageProgress++;
    pts=streak>=3?20:10; score+=pts;
    document.getElementById('correct-count').textContent=correctCount;
    document.getElementById('score').textContent=score;
    document.getElementById('streak').textContent=streak;
    document.getElementById('feedback').textContent='🎉 ຖືກຕ້ອງ! ເກັ່ງຫຼາຍ!';
    document.getElementById('feedback').className='feedback ok';
    document.getElementById('stars').textContent=streak>=5?'⭐⭐⭐':streak>=3?'⭐⭐':'⭐';
    ansHistory.push('ok'); lastOk=true; lastPts=pts;
    playCorrectSound();
    if(streak>=3)launchConfetti();
    updateStageUI();
    if(stageProgress >= STAGE_GOAL){
      stageJustCompleted = true;
    }
  } else {
    streak=0;
    document.getElementById('streak').textContent='0';
    document.getElementById('feedback').textContent='💡 ຄຳຕອບແມ່ນ '+correctAnswer;
    document.getElementById('feedback').className='feedback no';
    ansHistory.push('no'); lastOk=false; lastPts=0;
    playWrongSound();
  }
  renderHistory();
  document.getElementById('next-btn').style.display='block';
  return pts;
}

function checkAnswer(chosen,btn){
  if(answered)return;
  answered=true;
  var ok=(chosen===correctAnswer);
  btn.classList.add(ok?'correct':'wrong');
  if(!ok){
    document.querySelectorAll('.ans-btn').forEach(function(b){
      if(parseInt(b.textContent)===correctAnswer)b.classList.add('correct');
    });
  }
  document.querySelectorAll('.ans-btn').forEach(function(b){b.disabled=true;b.style.pointerEvents='none';});
  var pts=applyResult(ok);
  setTimeout(function(){openPopup(ok,pts);},400);
}

function checkInput(){
  if(answered)return;
  var val=parseInt(document.getElementById('ans-input').value);
  if(isNaN(val))return;
  answered=true;
  var ok=(val===correctAnswer);
  document.getElementById('ans-input').style.borderColor=ok?'#5BAD6F':'#E85D5D';
  var pts=applyResult(ok);
  setTimeout(function(){openPopup(ok,pts);},400);
}

// ── Popup ──
function openPopup(ok,pts){
  if(ok===undefined){ok=lastOk;pts=lastPts;}
  // ── ຖ້າຫາກຫາກໍ່ຜ່ານດ່ານ ສະແດງປ໋ອບອັບພິເສດ ──
  if(stageJustCompleted){
    stageJustCompleted = false;
    openStagePopup();
    return;
  }
  var icon,title,sub,badge;
  if(ok){
    var icons=['🎉','🌟','🏆','🥳','✨','🎊'];
    icon=icons[Math.floor(Math.random()*icons.length)];
    title=streak>=5?'ອາດມາກ! ສຸດຍອດ!':streak>=3?'ເກັ່ງຫຼາຍ!':'ຖືກຕ້ອງ!';
    sub=streak>=3?'🔥 ຕໍ່ເນື່ອງ '+streak+' ຄຳ!':'ດີຫຼາຍ ເດີ!';
    badge='⭐ +'+pts+' ຄະແນນ';
    // ── ໂຫຼດຮູບເດັກນ້ອຍ ເມື່ອຕອບຖືກ ──
    loadKidsPhoto();
  } else {
    // ບໍ່ສະແດງຮູບເມື່ອຕອບຜິດ
    var ovl_x = document.getElementById('popup-overlay');
    var pw_x = document.getElementById('popup-photo-wrap');
    if(pw_x) pw_x.classList.remove('has-image');
    if(ovl_x) ovl_x.classList.remove('with-photo');
    icon='💡';
    title='ໄດ້ຮຽນຮູ້ແລ້ວ!';
    sub='ຄຳຕອບແມ່ນ: '+correctAnswer;
    badge='💪 ຄ່ອຍໆ ພະຍາຍາມ!';
  }
  document.getElementById('popup-icon').textContent=icon;
  document.getElementById('popup-title').textContent=title;
  document.getElementById('popup-sub').textContent=sub;
  document.getElementById('popup-badge').textContent=badge;
  document.getElementById('popup-overlay').classList.add('show');
}

function loadKidsPhoto(callback){
  var photoWrap = document.getElementById('popup-photo-wrap');
  var photo = document.getElementById('popup-photo');
  var ovl = document.getElementById('popup-overlay');
  if(!photo || !photoWrap){ if(callback) callback(false); return; }
  photoWrap.classList.remove('has-image');
  ovl.classList.remove('with-photo');
  var attempts = ['kids.jpg', 'kids.jpeg', 'kids.png'];
  var idx = 0;
  photo.onload = function(){
    photoWrap.classList.add('has-image');
    ovl.classList.add('with-photo');
    if(callback) callback(true);
  };
  photo.onerror = function(){
    if(idx < attempts.length) tryNext();
    else {
      photoWrap.classList.remove('has-image');
      ovl.classList.remove('with-photo');
      if(callback) callback(false);
    }
  };
  function tryNext(){
    if(idx >= attempts.length) return;
    photo.src = attempts[idx++] + '?t=' + Date.now();
  }
  tryNext();
}

function updateStageUI(){
  var sn = document.getElementById('stage-num');
  if(sn) sn.textContent = stage;
  var fill = document.getElementById('progress-fill');
  if(fill){
    var pct = Math.min(100, (stageProgress/STAGE_GOAL)*100);
    fill.style.width = pct + '%';
    fill.classList.toggle('shine', stageProgress > 0 && stageProgress < STAGE_GOAL);
  }
  var dots = document.querySelectorAll('#progress-stars .ps-dot');
  dots.forEach(function(d, i){
    d.classList.toggle('filled', i < stageProgress);
  });
}

function openStagePopup(){
  var bonus = 50 + (stage * 10);
  score += bonus;
  document.getElementById('score').textContent = score;
  var passedStage = stage;
  stage++;
  stageProgress = 0;
  // ສະແດງເອັຟເຟັກໃນແຖບ
  var bar = document.getElementById('stage-bar');
  if(bar){
    bar.classList.add('complete');
    setTimeout(function(){ bar.classList.remove('complete'); }, 900);
  }
  // ດ່ານທີ 5, 10, 15... → ແນະນຳເລື່ອນລະດັບ
  var levelUpHint = '';
  if(passedStage % 3 === 0 && level < 3){
    levelUpHint = ' ລອງເລື່ອນລະດັບໃຫ້ຍາກຂຶ້ນເລີຍ! 🚀';
  } else if(passedStage % 5 === 0){
    levelUpHint = ' ເຈົ້າເກັ່ງສຸດໆ! 🎯';
  }
  var titles = ['🎊 ຜ່ານດ່ານໃໝ່!','🏆 ສຸດຍອດ!','🌟 ດີຫຼາຍ!','✨ ຍອດຍ້ຽມ!'];
  var title = titles[Math.floor(Math.random()*titles.length)];
  document.getElementById('popup-icon').textContent = '🏆';
  document.getElementById('popup-title').textContent = title;
  document.getElementById('popup-sub').textContent = 'ຜ່ານດ່ານທີ ' + passedStage + ' ສຳເລັດ! ໄປດ່ານທີ ' + stage + ' ກັນເລີຍ!' + levelUpHint;
  document.getElementById('popup-badge').textContent = '🌟 +' + bonus + ' ຄະແນນພິເສດ!';
  var ovl = document.getElementById('popup-overlay');
  ovl.classList.add('stage-mode');
  loadKidsPhoto();
  ovl.classList.add('show');
  setTimeout(function(){
    if(typeof launchConfetti === 'function'){
      launchConfetti();
      setTimeout(launchConfetti, 250);
      setTimeout(launchConfetti, 500);
      setTimeout(launchConfetti, 750);
    }
  }, 100);
  playStageSound();
  updateStageUI();
}

function playStageSound(){
  if(!soundOn) return;
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    var ctx = new Ctx();
    // 4-note ascending fanfare: C, E, G, C(high)
    var notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach(function(freq, i){
      var t0 = ctx.currentTime + i * 0.13;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.22, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.32);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + 0.34);
    });
    setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 1500);
  }catch(e){}
}

function closePopup(){
  document.getElementById('popup-overlay').classList.remove('show');
  document.getElementById('popup-overlay').classList.remove('stage-mode');
  document.getElementById('popup-overlay').classList.remove('with-photo');
}

function popupNext(){
  document.getElementById('popup-overlay').classList.remove('show');
  setTimeout(nextQuestion,120);
}

document.getElementById('popup-overlay').addEventListener('click',function(e){
  if(e.target===this)closePopup();
});

// ── History ──
function renderHistory(){
  var last=ansHistory.slice(-20);
  var h=document.getElementById('history');
  h.innerHTML='';
  last.forEach(function(r){
    var d=document.createElement('span');
    d.className='hist-dot';
    d.style.background=r==='ok'?'#5BAD6F':'#E85D5D';
    d.textContent=r==='ok'?'✓':'✗';
    h.appendChild(d);
  });
}

// ── Confetti ──
function launchConfetti(){
  var wrap=document.getElementById('confetti-wrap');
  wrap.innerHTML='';
  for(var i=0;i<30;i++){
    var p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=randInt(5,95)+'%'; p.style.top='-12px';
    p.style.background=confColors[randInt(0,confColors.length-1)];
    p.style.width=randInt(7,14)+'px'; p.style.height=randInt(7,14)+'px';
    p.style.borderRadius=randInt(0,1)?'50%':'3px';
    p.style.animationDelay=(i*0.04)+'s';
    p.style.animationDuration=(0.9+Math.random()*0.6)+'s';
    wrap.appendChild(p);
  }
  setTimeout(function(){wrap.innerHTML='';},2400);
}

document.getElementById('ans-input').addEventListener('keydown',function(e){
  if(e.key==='Enter')checkInput();
});

// ຕັ້ງຄ່າປຸ່ມສຽງເລີ່ມຕົ້ນ ຕາມການຕັ້ງຄ່າທີ່ບັນທຶກໄວ້
(function(){
  var btn = document.getElementById('sound-btn');
  if(btn && !soundOn){
    btn.textContent = '🔇';
    btn.classList.add('muted');
  }
})();

nextQuestion();
<\/script>

<script>
/* === Sound on/off === */
var soundOn = true;
function toggleSound(){
  soundOn = !soundOn;
  var btn = document.getElementById('sound-btn');
  if(soundOn){ btn.textContent = '🔊'; btn.classList.remove('muted'); }
  else { btn.textContent = '🔇'; btn.classList.add('muted'); window.speechSynthesis.cancel(); }
}

/* === Menu === */
function toggleMenu(e){
  if(e) e.stopPropagation();
  var panel = document.getElementById('menu-panel');
  if(panel.classList.contains('show')){ closeMenu(); } else { openMenu(); }
}
function openMenu(){
  document.getElementById('menu-btn').classList.add('open');
  document.getElementById('menu-panel').classList.add('show');
  document.getElementById('menu-overlay').classList.add('show');
}
function closeMenu(){
  document.getElementById('menu-btn').classList.remove('open');
  document.getElementById('menu-panel').classList.remove('show');
  document.getElementById('menu-overlay').classList.remove('show');
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeMenu();
});

/* === TTS - ປັບສຳລັບເດັກນ້ອຍຮຽນ ຊ້າ + ຊັດເຈນ === */
var voicesReady = false;
function loadVoices(){
  var v = window.speechSynthesis.getVoices();
  voicesReady = v && v.length > 0;
}
if('speechSynthesis' in window){
  try{ window.speechSynthesis.getVoices(); }catch(e){}
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  // ບາງເບຣົາເຊີໂຫຼດສຽງຊ້າ ລໍຖ້າເພີ່ມ
  setTimeout(loadVoices, 500);
  setTimeout(loadVoices, 1500);
}

/* ເລືອກສຽງທີ່ດີທີ່ສຸດ - ໃຫ້ຄະແນນ ແລະ ເລືອກສຽງຄຸນະພາບສູງສຸດ */
function pickBestVoice(lang){
  var voices = window.speechSynthesis.getVoices() || [];
  if(!voices.length) return null;
  var langPrefix = lang.toLowerCase().substr(0,2);
  var candidates = voices.filter(function(v){
    return v.lang && v.lang.toLowerCase().substr(0,2) === langPrefix;
  });
  if(!candidates.length) return null;
  function score(v){
    var s = 0;
    var name = (v.name||'').toLowerCase();
    if(v.lang.toLowerCase() === lang.toLowerCase()) s += 100;
    // ສຽງຄຸນະພາບສູງ (Premium / Neural / Natural)
    if(name.indexOf('natural')>=0) s += 50;
    if(name.indexOf('neural')>=0) s += 50;
    if(name.indexOf('premium')>=0) s += 45;
    if(name.indexOf('enhanced')>=0) s += 40;
    if(name.indexOf('online')>=0) s += 30;
    if(name.indexOf('google')>=0) s += 35;
    if(name.indexOf('microsoft')>=0) s += 30;
    if(name.indexOf('apple')>=0) s += 25;
    // ສຽງຜູ້ຍິງ (ດີສຳລັບເດັກ ຟັງງ່າຍ)
    if(name.indexOf('female')>=0) s += 15;
    if(name.indexOf('woman')>=0) s += 15;
    // ຊື່ສຽງຜູ້ຍິງທີ່ຮູ້ຈັກໃນແຕ່ລະພາສາ
    if(/(samantha|karen|moira|tessa|fiona|zira|hazel|catherine|allison|ava|joanna|salli|ivy|jenny|aria|emma|sonia|natasha)/i.test(v.name||'')) s += 12;
    if(/(child|kids|junior)/i.test(v.name||'')) s += 8;
    if(v.default) s += 3;
    return s;
  }
  candidates.sort(function(a,b){ return score(b) - score(a); });
  return candidates[0];
}

var currentSpeakingEl = null;
function speak(text, lang, el){
  if(!soundOn) return;
  if(!('speechSynthesis' in window)) return;
  // ລໍຖ້າສຽງໂຫຼດກ່ອນ
  var voices = window.speechSynthesis.getVoices();
  if(!voices.length){
    setTimeout(function(){ speak(text, lang, el); }, 250);
    return;
  }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if(currentSpeakingEl){ currentSpeakingEl.classList.remove('speaking'); }
  if(el){ el.classList.add('speaking'); currentSpeakingEl = el; }

  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US';
  var v = pickBestVoice(lang || 'en-US');
  if(v){ u.voice = v; u.lang = v.lang; }
  // ── ປັບຄ່າໃຫ້ເດັກນ້ອຍຟັງເຂົ້າໃຈ ──
  u.rate = 0.65;   // ຊ້າ - ໃຫ້ເດັກຟັງທັນ
  u.pitch = 1.15;  // ສູງເລັກນ້ອຍ - ນ້ຳສຽງສົດໃສ ຄ້າຍຄຸນຄູ
  u.volume = 1.0;
  u.onend = function(){ if(el) el.classList.remove('speaking'); if(currentSpeakingEl === el) currentSpeakingEl = null; };
  u.onerror = function(){ if(el) el.classList.remove('speaking'); };
  // Chrome ຕ້ອງຫຍຸດສັ້ນໆຫຼັງ cancel
  setTimeout(function(){
    try{ window.speechSynthesis.speak(u); }catch(e){}
  }, 60);
}

var currentTopic = 'alphabet';
function selectTopic(key){
  if(!topics[key]) return;
  currentTopic = key;
  document.querySelectorAll('.topic-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-topic') === key);
  });
  renderTopic();
}

function renderTopic(){
  var t = topics[currentTopic];
  document.getElementById('tt-ico').textContent = t.icon;
  document.getElementById('tt-text').textContent = t.title;
  document.getElementById('tt-sub').textContent = t.items.length + ' ຄຳ';
  var grid = document.getElementById('items-grid');
  grid.classList.toggle('letters', !!t.isLetters);
  grid.innerHTML = '';
  t.items.forEach(function(item){
    var card = document.createElement('div');
    card.className = 'item-card';
    if(item.bg){ card.style.background = item.bg; }
    if(item.fg){ card.style.color = item.fg; }
    var emojiEl = document.createElement('div');
    emojiEl.className = 'item-emoji';
    emojiEl.textContent = t.isLetters ? item.en : item.emoji;
    var enEl = document.createElement('div');

<script>
var soundOn = true;
function toggleSound(){
  soundOn = !soundOn;
  var btn = document.getElementById('sound-btn');
  if(soundOn){ btn.textContent = '🔊'; btn.classList.remove('muted'); }
  else { btn.textContent = '🔇'; btn.classList.add('muted'); window.speechSynthesis.cancel(); }
}

function toggleMenu(e){
  if(e) e.stopPropagation();
  var panel = document.getElementById('menu-panel');
  if(panel.classList.contains('show')){ closeMenu(); } else { openMenu(); }
}
function openMenu(){
  document.getElementById('menu-btn').classList.add('open');
  document.getElementById('menu-panel').classList.add('show');
  document.getElementById('menu-overlay').classList.add('show');
}
function closeMenu(){
  document.getElementById('menu-btn').classList.remove('open');
  document.getElementById('menu-panel').classList.remove('show');
  document.getElementById('menu-overlay').classList.remove('show');
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeMenu();
});

/* === TTS - ປັບສຳລັບເດັກນ້ອຍຮຽນພາສາຈີນ ຊ້າ + ຄົມ === */
var voicesReady = false;
function loadVoices(){
  var v = window.speechSynthesis.getVoices();
  voicesReady = v && v.length > 0;
}
if('speechSynthesis' in window){
  try{ window.speechSynthesis.getVoices(); }catch(e){}
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 500);
  setTimeout(loadVoices, 1500);
}

function pickBestVoice(lang){
  var voices = window.speechSynthesis.getVoices() || [];
  if(!voices.length) return null;
  var langPrefix = lang.toLowerCase().substr(0,2);
  var candidates = voices.filter(function(v){
    return v.lang && v.lang.toLowerCase().substr(0,2) === langPrefix;
  });
  if(!candidates.length) return null;
  function score(v){
    var s = 0;
    var name = (v.name||'').toLowerCase();
    var vlang = (v.lang||'').toLowerCase();
    if(vlang === lang.toLowerCase()) s += 100;
    // ສຳລັບພາສາຈີນ ໃຫ້ priority zh-CN ສູງສຸດ (ຈີນກາງ)
    if(langPrefix === 'zh'){
      if(vlang === 'zh-cn' || vlang === 'zh_cn') s += 80;
      else if(vlang.indexOf('zh-cn')>=0) s += 60;
      else if(vlang.indexOf('zh-tw')>=0) s += 20;
    }
    if(name.indexOf('natural')>=0) s += 50;
    if(name.indexOf('neural')>=0) s += 50;
    if(name.indexOf('premium')>=0) s += 45;
    if(name.indexOf('enhanced')>=0) s += 40;
    if(name.indexOf('online')>=0) s += 30;
    if(name.indexOf('google')>=0) s += 35;
    if(name.indexOf('microsoft')>=0) s += 30;
    if(name.indexOf('apple')>=0) s += 25;
    if(name.indexOf('female')>=0) s += 15;
    if(name.indexOf('woman')>=0) s += 15;
    // ຊື່ສຽງຜູ້ຍິງພາສາຈີນທີ່ຮູ້ຈັກ
    if(/(tingting|yating|sin-?ji|huihui|hanhan|xiaoxiao|xiaoyi|tracy|li-?mu|mei-?jia|yaoyao|kangkang)/i.test(v.name||'')) s += 12;
    if(/(samantha|karen|zira|aria|jenny|emma)/i.test(v.name||'')) s += 6;
    if(v.default) s += 3;
    return s;
  }
  candidates.sort(function(a,b){ return score(b) - score(a); });
  return candidates[0];
}

/* ດຶງເອົາສະເພາະຕົວອັກສອນຈີນ ຈາກຂໍ້ຄວາມ (ສຳລັບໃຫ້ TTS ອ່ານຊັດເຈນ) */
function extractChinese(text){
  if(!text) return text;
  var m = text.match(/[\\u4e00-\\u9fff]+/);
  return m ? m[0] : text;
}

var currentSpeakingEl = null;
function speak(text, lang, el){
  if(!soundOn) return;
  if(!('speechSynthesis' in window)) return;
  var voices = window.speechSynthesis.getVoices();
  if(!voices.length){
    setTimeout(function(){ speak(text, lang, el); }, 250);
    return;
  }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if(currentSpeakingEl){ currentSpeakingEl.classList.remove('speaking'); }
  if(el){ el.classList.add('speaking'); currentSpeakingEl = el; }

  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'zh-CN';
  var v = pickBestVoice(lang || 'zh-CN');
  if(v){ u.voice = v; u.lang = v.lang; }
  // ── ປັບໃຫ້ເດັກນ້ອຍຮຽນຟັງເຂົ້າໃຈ ──
  u.rate = 0.55;   // ຊ້າຫຼາຍ ໃຫ້ເດັກຟັງທັນ ໂດຍສະເພາະພາສາຈີນ
  u.pitch = 1.15;  // pitch ສູງ ສຽງຄົມຕັດຫູ
  u.volume = 1.0;
  u.onend = function(){ if(el) el.classList.remove('speaking'); if(currentSpeakingEl === el) currentSpeakingEl = null; };
  u.onerror = function(){ if(el) el.classList.remove('speaking'); };
  setTimeout(function(){
    try{ window.speechSynthesis.speak(u); }catch(e){}
  }, 60);
}

var currentTopic = 'numbers';
function selectTopic(key){
  if(!topics[key]) return;
  currentTopic = key;
  document.querySelectorAll('.topic-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-topic') === key);
  });
  renderTopic();
}

function renderTopic(){
  var t = topics[currentTopic];
  document.getElementById('tt-ico').textContent = t.icon;
  document.getElementById('tt-text').textContent = t.title;
  document.getElementById('tt-sub').textContent = t.items.length + ' ຄຳ';
  var grid = document.getElementById('items-grid');
  grid.innerHTML = '';
  t.items.forEach(function(item){
    var card = document.createElement('div');
    card.className = 'item-card';
    if(t.isPinyin) card.classList.add('pinyin');
    if(item.bg){ card.style.background = item.bg; }
    if(item.fg){ card.style.color = item.fg; }
    var emojiEl = document.createElement('div');
    emojiEl.className = 'item-emoji';
    emojiEl.textContent = t.isPinyin ? item.pinyin : item.emoji;
    var cnEl = document.createElement('div');
    cnEl.className = 'item-cn';
    cnEl.textContent = item.cn;
    var pyEl = document.createElement('div');
    pyEl.className = 'item-pinyin';
    pyEl.textContent = item.py;
    var laoEl = document.createElement('div');
    laoEl.className = 'item-lao';
    laoEl.textContent = item.lao;
    card.appendChild(emojiEl);
    card.appendChild(cnEl);
    card.appendChild(pyEl);
    card.appendChild(laoEl);
    card.addEventListener('click', function(){
      var spokenText;
      if(t.isPinyin){
        // ສຳລັບ pinyin: ໃຫ້ TTS ອ່ານຕົວອັກສອນຈີນຈາກ cn (ຊັດເຈນກວ່າອ່ານ pinyin ດຽວ)
        // ເຊັ່ນ "爸 bà" → ອ່ານ "爸"; ສຳລັບ tones "妈 (ແມ່)" → ອ່ານ "妈"
        var cnChar = extractChinese(item.cn);
        // ສຳລັບ tones, ອ່ານ pinyin ກ່ອນ ແລະ tone ຈະຖືກອອກສຽງຖືກຕ້ອງ
        spokenText = cnChar || item.pinyin || item.cn;
      } else {
        spokenText = item.cn;
      }
      speak(spokenText, 'zh-CN', card);
    });
    grid.appendChild(card);
  });
}

renderTopic();

    }
  } catch(e){}
  window.location.href = name + '.html';
}

<body>
<div class="app">

<script>
/* === Sound on/off === */
var soundOn = true;
function toggleSound(){
  soundOn = !soundOn;
  var btn = document.getElementById('sound-btn');
  if(soundOn){ btn.textContent = '🔊'; btn.classList.remove('muted'); }
  else { btn.textContent = '🔇'; btn.classList.add('muted'); window.speechSynthesis.cancel(); }
}

/* === Menu === */
function toggleMenu(e){
  if(e) e.stopPropagation();
  var panel = document.getElementById('menu-panel');
  if(panel.classList.contains('show')){ closeMenu(); } else { openMenu(); }
}
function openMenu(){
  document.getElementById('menu-btn').classList.add('open');
  document.getElementById('menu-panel').classList.add('show');
  document.getElementById('menu-overlay').classList.add('show');
}
function closeMenu(){
  document.getElementById('menu-btn').classList.remove('open');

}

/* === TTS — ໃຊ້ສຽງໄທແທນ ເພາະພາສາລາວສຽງໃກ້ຄຽງ === */
var voicesReady = false;
function loadVoices(){
  var v = window.speechSynthesis.getVoices();
  voicesReady = v && v.length > 0;
}
if('speechSynthesis' in window){
  try{ window.speechSynthesis.getVoices(); }catch(e){}
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 500);
  setTimeout(loadVoices, 1500);
}

function pickBestVoice(lang){
  var voices = window.speechSynthesis.getVoices() || [];
  if(!voices.length) return null;
  var langPrefix = lang.toLowerCase().substr(0,2);
  var candidates = voices.filter(function(v){
    return v.lang && v.lang.toLowerCase().substr(0,2) === langPrefix;
  });
  if(!candidates.length) return null;
  function score(v){
    var s = 0;
    var name = (v.name||'').toLowerCase();
    if(v.lang.toLowerCase() === lang.toLowerCase()) s += 100;
    if(name.indexOf('natural')>=0) s += 50;
    if(name.indexOf('neural')>=0) s += 50;
    if(name.indexOf('premium')>=0) s += 45;
    if(name.indexOf('enhanced')>=0) s += 40;
    if(name.indexOf('online')>=0) s += 30;
    if(name.indexOf('google')>=0) s += 35;
    if(name.indexOf('microsoft')>=0) s += 30;
    if(name.indexOf('apple')>=0) s += 25;
    if(name.indexOf('female')>=0) s += 15;
    if(name.indexOf('woman')>=0) s += 15;
    if(/(premwadee|narisa|kanya|achara|niwat)/i.test(v.name||'')) s += 12;
    if(v.default) s += 3;
    return s;
  }
  candidates.sort(function(a,b){ return score(b) - score(a); });
  return candidates[0];
}

var currentSpeakingEl = null;
function speak(text, el){
  if(!soundOn) return;
  if(!('speechSynthesis' in window)) return;
  var voices = window.speechSynthesis.getVoices();
  if(!voices.length){
    setTimeout(function(){ speak(text, el); }, 250);
    return;
  }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if(currentSpeakingEl){ currentSpeakingEl.classList.remove('speaking'); }
  if(el){ el.classList.add('speaking'); currentSpeakingEl = el; }

  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'th-TH';
  var v = pickBestVoice('th-TH');
  if(v){ u.voice = v; u.lang = v.lang; }
  u.rate = 0.78;   // ໄວປານກາງ ຟັງໄດ້ຊັດ
  u.pitch = 1.12;
  u.volume = 1.0;
  u.onend = function(){ if(el) el.classList.remove('speaking'); if(currentSpeakingEl === el) currentSpeakingEl = null; };
  u.onerror = function(){ if(el) el.classList.remove('speaking'); };
  setTimeout(function(){
    try{ window.speechSynthesis.speak(u); }catch(e){}
  }, 60);
}

  {lao:'ນ', thai:'น'}, {lao:'ບ', thai:'บ'}, {lao:'ມ', thai:'ม'}, {lao:'ວ', thai:'ว'}
];

var COMBINE_TONES = [
  {key:'none', label:'◌',   mark:'',  thaiMark:'',  hint:'ບໍ່ມີ'},
  {key:'ek',   label:'◌່', mark:'່', thaiMark:'่', hint:'ໄມ້ເອກ'},
  {key:'tho',  label:'◌້', mark:'້', thaiMark:'้', hint:'ໄມ້ໂທ'},
  {key:'tri',  label:'◌໊', mark:'໊', thaiMark:'๊', hint:'ໄມ້ຕີ'},
  {key:'jat',  label:'◌໋', mark:'໋', thaiMark:'๋', hint:'ໄມ້ຈັດຕະວາ'}
];

var selectedCons = null, selectedVow = null, selectedTone = null, selectedFinal = null;
var wordBuffer = []; // ສະສົມຄຳໄດ້ສູງສຸດ 10 ພະຍາງ
var WORD_MAX = 10;

function renderCombineUI(grid){
  grid.innerHTML = '';
  var box = document.createElement('div');
  box.className = 'combine-box';

  // Step 1: consonants
  var l1 = document.createElement('div');
  l1.className = 'combine-label';
  l1.innerHTML = '<span class="cl-num">1</span> ເລືອກພະຍັນຊະນະ';
  box.appendChild(l1);
  var consRow = document.createElement('div');
  consRow.className = 'combine-row';
  COMBINE_CONS.forEach(function(c){
    var btn = document.createElement('button');
    btn.className = 'chip cons-chip' + (c.compound ? ' cons-compound' : '');
    btn.textContent = c.lao;
    btn.setAttribute('data-key', c.lao);
    btn.onclick = function(){ selectCons(c, btn); };
    consRow.appendChild(btn);
  });
  box.appendChild(consRow);

  // Step 2: vowels
  var l2 = document.createElement('div');
  l2.className = 'combine-label';
  l2.innerHTML = '<span class="cl-num">2</span> ເລືອກສະຫຼະ';
  box.appendChild(l2);
  var vowRow = document.createElement('div');
  vowRow.className = 'combine-row';
  COMBINE_VOWELS.forEach(function(v){
    var btn = document.createElement('button');
    btn.className = 'chip vow-chip';
    btn.textContent = v.label;
    btn.setAttribute('data-key', v.key);
    btn.onclick = function(){ selectVow(v, btn); };
    vowRow.appendChild(btn);
  });
  box.appendChild(vowRow);

  // Step 3: tone marks (optional)
  var l3 = document.createElement('div');
  l3.className = 'combine-label';
  l3.innerHTML = '<span class="cl-num">3</span> ໃສ່ວັນນະຍຸດ <em class="cl-opt">(ຖ້າຕ້ອງການ)</em>';
  box.appendChild(l3);
  var toneRow = document.createElement('div');
  toneRow.className = 'combine-row';
  COMBINE_TONES.forEach(function(t){
    var btn = document.createElement('button');
    btn.className = 'chip tone-chip';
    btn.textContent = t.label;
    btn.setAttribute('data-key', t.key);
    btn.onclick = function(){ selectTone(t, btn); };
    toneRow.appendChild(btn);
  });
  box.appendChild(toneRow);

  // Step 4: final consonant (ຕົວສະກົດ) — optional
  var l4 = document.createElement('div');
  l4.className = 'combine-label';
  l4.innerHTML = '<span class="cl-num">4</span> ຕົວສະກົດ <em class="cl-opt">(ຖ້າຕ້ອງການ — ສຳລັບ ໄມ້ັ ໄມ້ົ ແລະ ອື່ນໆ)</em>';
  box.appendChild(l4);
  var finalRow = document.createElement('div');
  finalRow.className = 'combine-row';
  COMBINE_FINALS.forEach(function(f){
    var btn = document.createElement('button');
    btn.className = 'chip final-chip';
    btn.textContent = f.lao;
    btn.setAttribute('data-key', f.lao);
    btn.onclick = function(){ selectFinal(f, btn); };
    finalRow.appendChild(btn);
  });
  box.appendChild(finalRow);

  // Result display
  var result = document.createElement('div');
  result.className = 'combine-result';
  result.id = 'combine-result';
  box.appendChild(result);

  grid.appendChild(box);
  selectedCons = null; selectedVow = null; selectedTone = null; selectedFinal = null;
  wordBuffer = [];
  updateCombineResult();
}

function selectCons(c, btn){
  selectedCons = c;
  document.querySelectorAll('.cons-chip').forEach(function(b){
    b.classList.toggle('active', b === btn);
  });
  updateCombineResult();
  // ອ່ານສຽງພະຍັນຊະນະທັນທີ
  if(c){ speak(c.thai + 'อ', btn); }
}

function selectVow(v, btn){
  selectedVow = v;
  document.querySelectorAll('.vow-chip').forEach(function(b){
    b.classList.toggle('active', b === btn);
  });
  updateCombineResult();
  // ອ່ານສຽງສະຫຼະທັນທີ ໂດຍປະສົມກັບ ອ
  var thaiSyll = (v.thaiPre || '') + 'อ' + (v.thaiPost || '');
  speak(thaiSyll, btn);
}

function selectTone(t, btn){
  // ກົດຊ້ຳເພື່ອຍົກເລີກ
  if(selectedTone && selectedTone.key === t.key){
    selectedTone = null;
    btn.classList.remove('active');
  } else {
    selectedTone = t;
    document.querySelectorAll('.tone-chip').forEach(function(b){
      b.classList.toggle('active', b === btn);
    });
  }
  updateCombineResult();
}

function selectFinal(f, btn){
  // ກົດຊ້ຳເພື່ອຍົກເລີກ
  if(selectedFinal && selectedFinal.lao === f.lao){
    selectedFinal = null;
    btn.classList.remove('active');
  } else {
    selectedFinal = f;
    document.querySelectorAll('.final-chip').forEach(function(b){
      b.classList.toggle('active', b === btn);
    });
  }
  updateCombineResult();
  // ອ່ານສຽງສະກົດ
  if(selectedFinal){ speak('ตัว ' + f.thai, btn); }
}

function buildCurrentSyllable(){
  if(!selectedCons || !selectedVow) return null;
  var v = selectedVow, t = selectedTone, f = selectedFinal;
  // Lao Unicode order: pre + cons + mid(above-vowel) + tone + post + final
  var laoStr  = (v.laoPre  || '') + selectedCons.lao  + (v.laoMid  || '') + (t ? t.mark     : '') + (v.laoPost  || '') + (f ? f.lao  : '');
  var thaiStr = (v.thaiPre || '') + selectedCons.thai + (v.thaiMid || '') + (t ? t.thaiMark : '') + (v.thaiPost || '') + (f ? f.thai : '');
  return {lao: laoStr, thai: thaiStr};
}

function getWordLao(){
  return wordBuffer.map(function(s){ return s.lao; }).join('');
}
function getWordThai(){
  return wordBuffer.map(function(s){ return s.thai; }).join('');
}

function addSyllable(){
  var s = buildCurrentSyllable();
  if(!s) return;
  if(wordBuffer.length >= WORD_MAX) return;
  wordBuffer.push(s);
  // ລ້າງການເລືອກ ເພື່ອພ້ອມໃສ່ພະຍາງຕໍ່ໄປ
  selectedCons = null; selectedVow = null; selectedTone = null; selectedFinal = null;
  document.querySelectorAll('.cons-chip, .vow-chip, .tone-chip, .final-chip').forEach(function(b){
    b.classList.remove('active');
  });
  updateCombineResult();
  // ອ່ານພະຍາງທີ່ຫາກໍ່ເພີ່ມ
  speak(s.thai);
}

function popSyllable(){
  if(wordBuffer.length === 0) return;
  wordBuffer.pop();
  updateCombineResult();
}

function clearWord(){
  wordBuffer = [];
  selectedCons = null; selectedVow = null; selectedTone = null; selectedFinal = null;
  document.querySelectorAll('.cons-chip, .vow-chip, .tone-chip, .final-chip').forEach(function(b){
    b.classList.remove('active');
  });
  updateCombineResult();
}

function speakWord(){
  var thai = getWordThai();
  if(!thai) return;
  speak(thai);
}

function updateCombineResult(){
  var r = document.getElementById('combine-result');
  if(!r) return;
  r.innerHTML = '';
  var current = buildCurrentSyllable();

  // ຄຳສະສົມໃຫຍ່ — ຖ້າມີ
  if(wordBuffer.length > 0){
    var wordRow = document.createElement('div');
    wordRow.className = 'cr-word';
    wordRow.textContent = getWordLao();
    r.appendChild(wordRow);
    var wordSub = document.createElement('div');
    wordSub.className = 'cr-wordsub';
    wordSub.textContent = wordBuffer.length + ' / ' + WORD_MAX + ' ພະຍາງ';
    r.appendChild(wordSub);
  }

  // ພະຍາງປະຈຸບັນ (ກຳລັງສ້າງ) ຫຼື hint
  var preview = document.createElement('div');
  preview.className = 'cr-preview';
  if(current){
    preview.innerHTML = '<span class="cr-prev-label">ພະຍາງປະຈຸບັນ:</span> <span class="cr-prev-text">' + current.lao + '</span>';
  } else if(wordBuffer.length === 0){
    preview.innerHTML = '<span class="cr-hint">👇 ກົດເລືອກພະຍັນຊະນະ ແລະ ສະຫຼະ</span>';
  } else if(!selectedCons){
    preview.innerHTML = '<span class="cr-hint">⬆️ ເລືອກພະຍັນຊະນະ ເພື່ອເພີ່ມພະຍາງ</span>';
  } else {
    preview.innerHTML = '<span class="cr-hint">⬆️ ເລືອກສະຫຼະ ເພື່ອເພີ່ມພະຍາງ</span>';
  }
  r.appendChild(preview);

  // ປຸ່ມ ➕ ⌫ ✕
  var btnRow = document.createElement('div');
  btnRow.className = 'cr-btnrow';

  var addBtn = document.createElement('button');
  addBtn.className = 'cr-btn cr-add';
  addBtn.textContent = '➕ ເພີ່ມພະຍາງ';
  addBtn.disabled = !current || wordBuffer.length >= WORD_MAX;
  addBtn.onclick = addSyllable;
  btnRow.appendChild(addBtn);

  var popBtn = document.createElement('button');
  popBtn.className = 'cr-btn cr-pop';
  popBtn.textContent = '⌫ ລົບ';
  popBtn.disabled = wordBuffer.length === 0;
  popBtn.onclick = popSyllable;
  btnRow.appendChild(popBtn);

  var clrBtn = document.createElement('button');
  clrBtn.className = 'cr-btn cr-clr';
  clrBtn.textContent = '✕ ລ້າງ';
  clrBtn.disabled = wordBuffer.length === 0 && !current;
  clrBtn.onclick = clearWord;
  btnRow.appendChild(clrBtn);
  r.appendChild(btnRow);

  // ປຸ່ມຟັງສຽງໃຫຍ່ — ຄຳສະສົມ ຫຼື ພະຍາງປະຈຸບັນ
  var speakBtn = document.createElement('button');
  speakBtn.className = 'cr-speak';
  if(wordBuffer.length > 0){
    speakBtn.textContent = '🔊 ກົດຟັງສຽງຄຳ';
    speakBtn.onclick = function(){ speak(getWordThai(), speakBtn); };
  } else if(current){
    speakBtn.textContent = '🔊 ກົດຟັງສຽງພະຍາງ';
    speakBtn.onclick = function(){ speak(current.thai, speakBtn); };
  } else {
    speakBtn.textContent = '🔊 ເລືອກກ່ອນ';
    speakBtn.disabled = true;
  }
  r.appendChild(speakBtn);
}

var currentTopic = 'consonants';
function selectTopic(key){
  if(!topics[key]) return;
  currentTopic = key;
  document.querySelectorAll('.topic-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-topic') === key);
  });
  renderTopic();
}

function renderTopic(){
  var t = topics[currentTopic];
  document.getElementById('tt-ico').textContent = t.icon;
  document.getElementById('tt-text').textContent = t.title;
  var grid = document.getElementById('items-grid');
  grid.classList.toggle('vowels', !!t.isVowels);
  grid.classList.toggle('numbers', !!t.isNumbers);
  grid.classList.toggle('tones', !!t.isTones);
  grid.classList.toggle('with-emoji', !!t.hasEmoji);
  grid.classList.toggle('combine', !!t.isCombine);
  if(t.isCombine){
    document.getElementById('tt-sub').textContent = '27 × 16 = ປະສົມສຽງ';
    renderCombineUI(grid);
    return;
  }
  document.getElementById('tt-sub').textContent = t.items.length + ' ' + (t.subKey || 'ໂຕ');
  grid.innerHTML = '';
  t.items.forEach(function(item){
    var card = document.createElement('div');
    card.className = 'item-card';
    // ໂຕອັກສອນ + ຮູບປະກອບ ໃຫ້ເດັກສັງເກດງ່າຍ
    if(t.hasEmoji && item.emoji){
      var topRow = document.createElement('div');
      topRow.className = 'item-top';
      var letterEl = document.createElement('span');
      letterEl.className = 'item-letter';
      letterEl.textContent = item.lao;
      var emojiEl = document.createElement('span');
      emojiEl.className = 'item-pic';
      // ຮອງຮັບ SVG inline (ສຳລັບທຸງຊາດ ແລະ ຮູບສະເພາະອື່ນໆ)
      if(item.emoji.indexOf('<svg') === 0){
        emojiEl.classList.add('item-pic-svg');
        emojiEl.innerHTML = item.emoji;
      } else {
        emojiEl.textContent = item.emoji;
      }
      topRow.appendChild(letterEl);
      topRow.appendChild(emojiEl);
      card.appendChild(topRow);
    } else {
      var letterEl = document.createElement('div');
      letterEl.className = 'item-letter';
      letterEl.textContent = item.lao;
      card.appendChild(letterEl);
    }
    var wordEl = document.createElement('div');
    wordEl.className = 'item-word';
    wordEl.textContent = item.word;
    var meaningEl = document.createElement('div');
    meaningEl.className = 'item-meaning';
    meaningEl.textContent = item.meaning;
    card.appendChild(wordEl);
    card.appendChild(meaningEl);
    card.addEventListener('click', function(){
      speak(item.spoken, card);
    });
    grid.appendChild(card);
  });
}

renderTopic();
<\/script>

  try {
    if(window.parent && window.parent !== window){

      return;
    }
  } catch(e){}
  window.location.href = name + '.html';
}
<\/script>
</body>

  .crayons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px 6px; }
  .crayon {

    background: rgba(255,255,255,0.7);
    padding: 1px 3px;
    border-radius: 4px;
    white-space: nowrap;

  .crayon.selected .crayon-name {
    background: #fdcb6e;
    color: #2d3436;
  }
  .selected-color-display {
    background: rgba(255,255,255,0.6);
    border-radius: 10px;
    padding: 6px 10px;
    margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 0.85em;
    font-weight: bold;
    color: #2d3436;
  }
  .selected-color-swatch {
    width: 22px; height: 22px;

    border: 2px solid #2d3436;
    background: #e74c3c;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);

  .crayon:hover { transform: translateY(-5px) rotate(-3deg); }
  .crayon.selected { transform: translateY(-10px) scale(1.1); filter: drop-shadow(0 6px 8px rgba(0,0,0,0.3)); }
  .crayon.selected::before {
    content: ''; position: absolute; bottom: -8px;
    width: 90%; height: 4px;
    background: linear-gradient(90deg, transparent, #fdcb6e, transparent);
    border-radius: 2px;
  }
  .crayon.selected::after {
    content: ''; position: absolute; top: -10px;
    width: 6px; height: 6px;
    background: #fdcb6e;
    border-radius: 50%;
    box-shadow: 0 0 10px #ffd700;
    animation: sparkle 1.2s ease-in-out infinite;
  }
  @keyframes sparkle {
    0%, 100% { opacity: 0.6; transform: scale(1); }

    width: 0; height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;

    border-radius: 4px;
    border: 2px solid #2d3436;
    margin-top: -1px; position: relative;

  .crayon-body::before, .crayon-body::after {
    content: ''; position: absolute; left: 0; right: 0;

  .crayon-body::after  { bottom: 8px; }

  .size-btn[data-size="16"] { width: 38px; height: 38px; }

let selectedColor = COLORS[0].hex;
let brushSize = 16;
let isErasing = false;
let isDrawing = false;
let lastX = 0, lastY = 0;
let currentPic = 0;
let masks = [];

// Drawing on temp stroke canvas at full alpha, then commit at lower alpha to main canvas
// to avoid self-overlap darkening within a single stroke.
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let strokeCanvas, strokeCtx;
const outlineSvg = document.getElementById('outlineSvg');
const MASK_SIZE = 400;
const STROKE_ALPHA = 0.55; // lower = more visible mixing

const sel = document.getElementById('picSelector');
PICS.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'pic-btn' + (i === 0 ? ' active' : '');
  b.dataset.pic = i;
  b.innerHTML = \`<span>\${p.emoji}</span><span>\${p.name}</span>\`;
  b.onclick = () => {
    document.querySelectorAll('.pic-btn').forEach(x => x.classList.remove('active'));

    loadPicture(i);
  };
  sel.appendChild(b);
});

const crayonsDiv = document.getElementById('crayons');
COLORS.forEach((c, i) => {
  const d = document.createElement('div');
  d.className = 'crayon' + (i === 0 ? ' selected' : '');
  d.title = c.name;
  // Use white text for dark colors, dark text for light colors
  const textColor = isLightColor(c.hex) ? '#2d3436' : '#ffffff';
  d.innerHTML = \`<div class="crayon-tip" style="border-bottom-color:\${c.hex}"></div>
                 <div class="crayon-body" style="background:\${c.hex}"></div>
                 <div class="crayon-name">\${c.name}</div>\`;
  d.onclick = () => {
    selectedColor = c.hex;
    isErasing = false;
    document.getElementById('eraserBtn').classList.remove('active');
    document.querySelectorAll('.crayon').forEach(x => x.classList.remove('selected'));
    d.classList.add('selected');
    document.getElementById('selectedColorName').textContent = c.name;
    document.getElementById('selectedColorSwatch').style.background = c.hex;
  };

function isLightColor(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return (r*299 + g*587 + b*114) / 1000 > 160;
}

document.querySelectorAll('.size-btn').forEach(b => {
  b.onclick = () => {
    brushSize = parseInt(b.dataset.size);
    document.querySelectorAll('.size-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  };
});

function toggleEraser() {
  isErasing = !isErasing;
  document.getElementById('eraserBtn').classList.toggle('active', isErasing);
}

function setupCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stroke buffer
  strokeCanvas = document.createElement('canvas');
  strokeCanvas.width = canvas.width;
  strokeCanvas.height = canvas.height;
  strokeCtx = strokeCanvas.getContext('2d');
  strokeCtx.scale(dpr, dpr);
  strokeCtx.lineCap = 'round';
  strokeCtx.lineJoin = 'round';
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const evt = e.touches ? e.touches[0] : e;
  return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
}

function clearStrokeBuffer() {
  const dpr = window.devicePixelRatio || 1;
  strokeCtx.setTransform(1, 0, 0, 1, 0, 0);
  strokeCtx.clearRect(0, 0, strokeCanvas.width, strokeCanvas.height);
  strokeCtx.scale(dpr, dpr);
  strokeCtx.lineCap = 'round';
  strokeCtx.lineJoin = 'round';
}

function startDraw(e) {
  e.preventDefault();
  isDrawing = true;
  const p = getPos(e);
  lastX = p.x; lastY = p.y;
  if (isErasing) {
    ctx.beginPath();
    ctx.fillStyle = 'white';
    ctx.arc(p.x, p.y, brushSize / 2, 0, Math.PI * 2);
    ctx.fill();
  } else {
    clearStrokeBuffer();
    strokeCtx.beginPath();
    strokeCtx.fillStyle = selectedColor;
    strokeCtx.arc(p.x, p.y, brushSize / 2, 0, Math.PI * 2);
    strokeCtx.fill();
  }
}

function draw(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const p = getPos(e);
  if (isErasing) {
    ctx.beginPath();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = brushSize;
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  } else {
    strokeCtx.beginPath();
    strokeCtx.strokeStyle = selectedColor;
    strokeCtx.lineWidth = brushSize;
    strokeCtx.moveTo(lastX, lastY);
    strokeCtx.lineTo(p.x, p.y);
    strokeCtx.stroke();
    // Render preview of the in-progress stroke onto main
    redrawWithStrokePreview();
  }
  lastX = p.x; lastY = p.y;
}

// Composite the current in-progress stroke onto the main canvas without committing
let mainSnapshot = null;
function snapshotMain() {
  mainSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
}
function restoreMain() {
  if (mainSnapshot) ctx.putImageData(mainSnapshot, 0, 0);
}

function redrawWithStrokePreview() {
  // Draw stroke buffer over the snapshot at lowered alpha for a "wax" look
  if (mainSnapshot) ctx.putImageData(mainSnapshot, 0, 0);
  const dpr = window.devicePixelRatio || 1;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = STROKE_ALPHA;
  ctx.drawImage(strokeCanvas, 0, 0);
  ctx.restore();
}

function endDraw() {
  if (!isDrawing) return;
  isDrawing = false;
  if (!isErasing) {
    // Apply real subtractive (paint-like) color mixing where stroke overlaps existing color
    commitStrokeWithMixing();
    snapshotMain();
  } else {
    snapshotMain();
  }
  updateLiveScore();
}

// Subtractive (paint-like) color mixing: yellow + red = orange, blue + yellow = green, etc.
function commitStrokeWithMixing() {
  const w = canvas.width, h = canvas.height;
  if (!mainSnapshot) return;
  const baseData = mainSnapshot.data; // base before this stroke
  const strokeImg = strokeCtx.getImageData(0, 0, w, h);
  const sd = strokeImg.data;
  const out = ctx.createImageData(w, h);
  const od = out.data;
  for (let i = 0; i < od.length; i += 4) {
    const sa = sd[i + 3]; // stroke alpha (0-255)
    const br = baseData[i], bg = baseData[i + 1], bb = baseData[i + 2];
    if (sa === 0) {
      od[i] = br; od[i+1] = bg; od[i+2] = bb; od[i+3] = 255;
      continue;
    }
    const sr = sd[i], sg = sd[i + 1], sb = sd[i + 2];
    const baseIsWhite = br > 240 && bg > 240 && bb > 240;
    const a = (sa / 255) * 0.75; // mixing intensity (slightly translucent feel)
    if (baseIsWhite) {
      // Just paint over white - normal alpha blend
      od[i]   = Math.round(sr * a + br * (1 - a));
      od[i+1] = Math.round(sg * a + bg * (1 - a));
      od[i+2] = Math.round(sb * a + bb * (1 - a));
    } else {
      // Subtractive mix in CMY space => paint-like blending
      const c1 = 1 - br/255, m1 = 1 - bg/255, y1 = 1 - bb/255;
      const c2 = 1 - sr/255, m2 = 1 - sg/255, y2 = 1 - sb/255;
      const k = 0.6 * a; // mixing weight - higher = more aggressive mix
      const cn = Math.min(1, c1 + c2 * k);
      const mn = Math.min(1, m1 + m2 * k);
      const yn = Math.min(1, y1 + y2 * k);
      od[i]   = Math.round((1 - cn) * 255);
      od[i+1] = Math.round((1 - mn) * 255);
      od[i+2] = Math.round((1 - yn) * 255);
    }
    od[i+3] = 255;
  }
  ctx.putImageData(out, 0, 0);
}

canvas.addEventListener('mousedown', (e) => { snapshotMain(); startDraw(e); });
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', (e) => { snapshotMain(); startDraw(e); }, { passive: false });
canvas.addEventListener('touchmove', draw, { passive: false });
canvas.addEventListener('touchend', endDraw);
canvas.addEventListener('touchcancel', endDraw);

// Build mask AND reference RGB from colored SVG
function buildMaskAndRef(coloredSvgInner) {
  return new Promise((resolve) => {
    // Render onto white background to get the actual reference colors
    const svgStr = \`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="\${MASK_SIZE}" height="\${MASK_SIZE}"><rect width="100%" height="100%" fill="white"/>\${coloredSvgInner}</svg>\`;
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = MASK_SIZE; c.height = MASK_SIZE;
      const cx = c.getContext('2d');
      cx.drawImage(img, 0, 0, MASK_SIZE, MASK_SIZE);
      const data = cx.getImageData(0, 0, MASK_SIZE, MASK_SIZE).data;
      const mask = new Uint8Array(MASK_SIZE * MASK_SIZE);
      const refRGB = new Uint8ClampedArray(MASK_SIZE * MASK_SIZE * 3);
      // Also build mask from a separate render with no white background
      // For simplicity, treat any non-white pixel as inside.
      for (let i = 0, j = 0; i < data.length; i += 4, j++) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        // Inside = not pure white (since reference is colored on white bg)
        const isInside = !(r > 245 && g > 245 && b > 245);
        mask[j] = isInside ? 1 : 0;
        refRGB[j*3]   = r;
        refRGB[j*3+1] = g;
        refRGB[j*3+2] = b;
      }
      URL.revokeObjectURL(url);
      resolve({ mask, refRGB });
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve({ mask: new Uint8Array(MASK_SIZE * MASK_SIZE), refRGB: new Uint8ClampedArray(MASK_SIZE * MASK_SIZE * 3) }); };
    img.src = url;
  });
}

let refImages = [];
async function preloadMasks() {
  for (let i = 0; i < PICS.length; i++) {
    const r = await buildMaskAndRef(PICS[i].colored);
    masks[i] = r.mask;
    refImages[i] = r.refRGB;
  }
}

function loadPicture(idx) {
  currentPic = idx;
  outlineSvg.innerHTML = PICS[idx].outline;
  document.getElementById('refImg').innerHTML =
    \`<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">\${PICS[idx].colored}</svg>\`;
  document.getElementById('refHint').textContent = PICS[idx].hint;
  setupCanvas();
  snapshotMain();
  updateLiveScore();
}

function calculateScore() {
  const w = canvas.width, h = canvas.height;
  if (w === 0 || h === 0 || !masks[currentPic]) {
    return { score: 0, coveragePct: 0, varietyCount: 0, spillPct: 0, accuracyPct: 0, goodPct: 0,
             coverageScore: 0, accuracyScore: 0, varietyScore: 0, effortBonus: 0, penalty: 0 };
  }
  const mask = masks[currentPic];
  const ref = refImages[currentPic];
  const sampleStep = 4;
  let insideTotal = 0, outsideTotal = 0;
  let insideColored = 0, outsideColored = 0;
  let insideMatched = 0;          // pixels colored AND similar to reference
  let accuracySum = 0, accuracyCount = 0;
  const colorBuckets = new Set();
  const data = ctx.getImageData(0, 0, w, h).data;
  for (let y = 0; y < h; y += sampleStep) {
    for (let x = 0; x < w; x += sampleStep) {
      const i = (y * w + x) * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const isWhite = r > 240 && g > 240 && b > 240;
      const mx = Math.floor(x / w * MASK_SIZE);
      const my = Math.floor(y / h * MASK_SIZE);
      const mIdx = my * MASK_SIZE + mx;
      const inside = mask[mIdx] === 1;
      if (inside) {
        insideTotal++;
        if (!isWhite) {
          insideColored++;
          colorBuckets.add((r >> 5) * 64 + (g >> 5) * 8 + (b >> 5));
          const rr = ref[mIdx*3], rg = ref[mIdx*3+1], rb = ref[mIdx*3+2];
          const dist = Math.sqrt((r-rr)*(r-rr) + (g-rg)*(g-rg) + (b-rb)*(b-rb));
          // Pixel "matches" reference if distance < 100
          if (dist < 100) insideMatched++;
          const similarity = Math.max(0, 1 - dist / 120);
          accuracySum += similarity;
          accuracyCount++;
        }
      } else {
        outsideTotal++;
        if (!isWhite) outsideColored++;
      }
    }
  }
  const coverage = insideTotal > 0 ? insideColored / insideTotal : 0;
  const spillRatio = outsideTotal > 0 ? outsideColored / outsideTotal : 0;
  const accuracy = accuracyCount > 0 ? accuracySum / accuracyCount : 0;
  // ສ່ວນສຳຄັນ: % ຂອງພື້ນທີ່ທີ່ລະບາຍຖືກສີ (ທັງລະບາຍ ແລະ ສີຖືກ)
  const goodCoverage = insideTotal > 0 ? insideMatched / insideTotal : 0;

  // ========== ຄະແນນ = % ການລະບາຍຖືກສີຂອງພື້ນທີ່ທັງໝົດ ==========
  // ຂີດສີດຽວນ້ອຍໆ → coverage 5% → goodCov 5% → ໄດ້ 0-1 ຄະແນນ
  // ລະບາຍຄົບເຕັມຮູບດ້ວຍສີຖືກ → goodCov 90%+ → ໄດ້ 9-10 ຄະແນນ

  // ຄະແນນຫຼັກຈາກ "good coverage" (ສູງສຸດ 9 ຄະແນນ)
  // ໃຊ້ linear: 90% = 9 ຄະແນນ
  let mainScore = goodCoverage * 10; // 0-10 scale before adjustments
  // ໂບນັດສຳລັບໃຊ້ຫຼາຍສີ (ສູງສຸດ +1)
  let varietyScore = 0;
  if (colorBuckets.size >= 2) varietyScore = 0.4;
  if (colorBuckets.size >= 3) varietyScore = 0.7;
  if (colorBuckets.size >= 4) varietyScore = 1;

  // ໂທດສີອອກນອກເສັ້ນ - ສູງສຸດ -3, ຍົກເວັ້ນ 1%
  let penalty = 0;
  if (spillRatio > 0.01) {
    penalty = Math.min((spillRatio - 0.01) * 35, 3);
  }

  let score = mainScore + varietyScore - penalty;
  score = Math.max(0, score);

  // ການໃຫ້ຄະແນນຍ່ອຍ (ສຳລັບສະແດງ breakdown)
  const coverageScore = Math.round(Math.min(coverage / 0.85, 1) * 5 * 10) / 10;
  const accuracyScore = Math.round(Math.min(accuracy / 0.85, 1) * 5 * 10) / 10;

  // ຄະແນນເຕັມ 10 ສຳລັບການລະບາຍດີຫຼາຍ
  if (goodCoverage >= 0.85 && colorBuckets.size >= 3 && spillRatio < 0.015) {
    score = 10;
  } else if (score > 9.5) {
    score = 9; // ບໍ່ໃຫ້ເຕັມຖ້າເງື່ອນໄຂບໍ່ຄົບ
  }

  return {
    score: Math.min(Math.round(score), 10),
    coveragePct: Math.round(coverage * 100),
    spillPct: Math.round(spillRatio * 100),
    accuracyPct: Math.round(accuracy * 100),
    goodPct: Math.round(goodCoverage * 100),
    varietyCount: colorBuckets.size,
    coverageScore: coverageScore,
    accuracyScore: accuracyScore,
    varietyScore: Math.round(varietyScore * 10) / 10,
    effortBonus: 0,
    penalty: Math.round(penalty * 10) / 10,
    mainScore: Math.round(mainScore * 10) / 10
  };
}

function getStars(score) {
  const filled = Math.min(5, Math.round(score / 2));
  return '⭐'.repeat(filled) + '☆'.repeat(5 - filled);
}

let lastScore = 0;
function celebrateConfetti() {
  const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#ff9ff3', '#a29bfe', '#fd79a8'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-20px';
    c.style.animation = 'confetti-fall ' + (1.5 + Math.random() * 2) + 's ' + (Math.random() * 0.5) + 's linear forwards';
    if (Math.random() > 0.5) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    setTimeout(function() { c.remove(); }, 4000);
  }
}

function getMessage(r) {
  if (r.score === 0 && r.coveragePct === 0) return 'ມາລະບາຍສີກັນເຖາະ! 🎨';
  if (r.spillPct >= 6) return 'ສີອອກນອກເສັ້ນຫຼາຍ ລະວັງເບິ່ງ ⚠️';
  if (r.goodPct < 15) return 'ລະບາຍຕື່ມເລີຍ ຍັງເປົ່າຫຼາຍ 💪';
  if (r.accuracyPct < 50 && r.coveragePct >= 30) return 'ລະບາຍສີໃຫ້ຄືຮູບຕົວຢ່າງເດີ້ 🎯';
  if (r.score <= 2) return 'ລະບາຍຕື່ມຕາມສີຮູບຕົວຢ່າງ 🖍️';
  if (r.score <= 4) return 'ດີຂຶ້ນ! ຍັງຕ້ອງລະບາຍໃຫ້ເຕັມ 🌈';
  if (r.score <= 6) return 'ດີແລ້ວ! ລະບາຍໃຫ້ຄົບທຸກບ່ອນ 🎨';
  if (r.score <= 8) return 'ສວຍງາມຫຼາຍ! ເກືອບສົມບູນແລ້ວ 🌟';
  if (r.score === 9) return 'ດີເລີດ! ເກືອບເຕັມຄະແນນແລ້ວ! ✨';
  return 'ຍອດຍ້ຽມແທ້! ໄດ້ຄະແນນເຕັມ! 🏆🎉';
}

function updateLiveScore() {
  const r = calculateScore();
  const scoreEl = document.getElementById('liveScore');
  const scoreDisplay = document.querySelector('.score-display');

  if (r.score > lastScore) {
    scoreEl.classList.remove('pop');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('pop');
    if (r.score >= 8 && lastScore < 8) {
      scoreDisplay.classList.remove('celebrating');
      void scoreDisplay.offsetWidth;
      scoreDisplay.classList.add('celebrating');
    }
  }
  lastScore = r.score;

  scoreEl.textContent = r.score;
  document.getElementById('liveStars').textContent = getStars(r.score);
  document.getElementById('liveMsg').textContent = getMessage(r);
  document.getElementById('liveDetail').textContent =
    \`ລະບາຍຖືກສີ: \${r.goodPct}% • ລະບາຍ: \${r.coveragePct}% • ສີ: \${r.varietyCount}\`;
}

function showFinalScore() {
  const r = calculateScore();
  document.getElementById('modalScore').textContent = r.score;
  document.getElementById('modalStars').textContent = getStars(r.score);
  document.getElementById('modalMsg').textContent = getMessage(r);
  document.getElementById('modalTitle').textContent =
    r.score >= 9 ? '🏆 ຍອດຍ້ຽມ!' :
    r.score >= 7 ? '🎉 ສວຍງາມຫຼາຍ!' :
    r.score >= 5 ? '👏 ເກັ່ງຫຼາຍ!' :
    r.score >= 3 ? '😊 ດີແລ້ວ!' : '💪 ສືບຕໍ່ເລີຍ!';

  let html = \`
    <div class="breakdown-row"><span>🎨 ລະບາຍຖືກສີ (\${r.goodPct}% ຂອງພາບ)</span><span>+\${r.mainScore}</span></div>
    <div class="breakdown-row"><span>📊 ລະບາຍທັງໝົດ</span><span>\${r.coveragePct}%</span></div>
    <div class="breakdown-row"><span>🎯 ສີຄ້າຍຄືຮູບຕົວຢ່າງ</span><span>\${r.accuracyPct}%</span></div>
    <div class="breakdown-row"><span>🌈 ໃຊ້ສີຫຼາກຫຼາຍ (\${r.varietyCount} ສີ)</span><span>+\${r.varietyScore}</span></div>\`;
  if (r.penalty > 0) {
    html += \`<div class="breakdown-row bad"><span>🚨 ອອກນອກເສັ້ນ (\${r.spillPct}%)</span><span>−\${r.penalty}</span></div>\`;
  }
  document.getElementById('modalBreakdown').innerHTML = html;
  document.getElementById('modal').classList.add('show');

  if (r.score >= 8) {
    setTimeout(celebrateConfetti, 300);
    if (r.score === 10) setTimeout(celebrateConfetti, 800);
  }
}

const loaded = { math: false, english: false, chinese: false, lao: false, coloring: false };

function loadFrame(name){
  if(loaded[name]) return;
  const frame = document.getElementById('frame-' + name);
  frame.srcdoc = FRAMES_HTML[name];
  loaded[name] = true;
}

function showView(name){
  if(!FRAMES_HTML[name]) return;
  loadFrame(name);
  document.querySelectorAll('.view-frame').forEach(f => f.classList.remove('active'));
  document.getElementById('frame-' + name).classList.add('active');
  document.getElementById('picker').classList.add('hidden');
  try{ localStorage.setItem('lastView', name); }catch(e){}
  // ຫຍຸດສຽງເກົ່າທີ່ກຳລັງເວົ້າຢູ່ໃນ frame ອື່ນ
  ['math','english','chinese','lao','coloring'].forEach(n => {
    if(n !== name){
      const f = document.getElementById('frame-' + n);
      try{ if(f.contentWindow && f.contentWindow.speechSynthesis) f.contentWindow.speechSynthesis.cancel(); }catch(e){}
    }
  });
}

function showPicker(){
  document.querySelectorAll('.view-frame').forEach(f => f.classList.remove('active'));
  document.getElementById('picker').classList.remove('hidden');
  // ຫຍຸດສຽງທຸກ frame
  ['math','english','chinese','lao','coloring'].forEach(n => {
    const f = document.getElementById('frame-' + n);
    try{ if(f.contentWindow && f.contentWindow.speechSynthesis) f.contentWindow.speechSynthesis.cancel(); }catch(e){}
  });
}

window.addEventListener('message', (e) => {
  if(e.data && e.data.type === 'switchView' && e.data.view){
    if(e.data.view === 'home' || e.data.view === 'picker'){
      showPicker();
    } else {
      showView(e.data.view);
    }
  }
});

// ບັນທຶກ view ສຸດທ້າຍ
try {

  // ບໍ່ auto-load. ສະແດງ picker ກ່ອນສະເໝີ
} catch(e){}
</script>
