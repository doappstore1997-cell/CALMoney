<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ຮຽນມ່ວນໆ - DeDyDeMy</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; min-height: 100%; -webkit-tap-highlight-color: transparent; }
  body {
    background: #FFF8EE;
    background-image:
      radial-gradient(circle at 10% 20%, #FFE0F0 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, #DDEEFF 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, #E8F0FF 0%, transparent 60%);
    font-family: 'Noto Sans Lao', sans-serif;
    min-height: 100vh;
  }
  .picker {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: clamp(16px,4vw,30px);
    gap: clamp(14px,3vw,22px);
  }
  .picker-icon {
    font-size: clamp(50px,14vw,80px);
    animation: bounce 2s infinite;
  }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .picker-title {
    font-size: clamp(24px,7vw,38px); font-weight: 900;
    color: #7C6FCD; text-align: center; line-height: 1.2;
  }
  .picker-sub {
    font-size: clamp(13px,3.5vw,16px); color: #7B6F9A;
    font-weight: 700; text-align: center;
    margin-bottom: clamp(8px,2vw,14px);
  }
  .picker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(clamp(150px,40vw,200px), 1fr));
    gap: clamp(10px,2.5vw,16px);
    width: 100%; max-width: 700px;
  }
  .picker-btn {
    padding: clamp(18px,4vw,26px) clamp(14px,3vw,20px);
    border: 3px solid #E8DFF8;
    border-radius: 24px;
    background: #fff; color: #3A2E5A;
    cursor: pointer; text-decoration: none;
    font-family: 'Noto Sans Lao', sans-serif;
    font-weight: 900;
    box-shadow: 0 6px 0 rgba(0,0,0,0.08);
    transition: all 0.18s;
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; text-align: center; line-height: 1.2;
    position: relative;
  }
  .picker-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.08); }
  .picker-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,0.12); }
  .pb-icon { font-size: clamp(40px,10vw,56px); line-height: 1; }
  .pb-title { font-size: clamp(15px,4vw,18px); font-weight: 900; }
  .pb-desc { font-size: clamp(11px,2.8vw,13px); color: #7B6F9A; font-weight: 700; }
  .pb-math { border-color: #C5BCFF; background: linear-gradient(135deg, #FFFFFF, #EEE9FF); }
  .pb-math .pb-title { color: #7C6FCD; }
  .pb-en { border-color: #B8D8F0; background: linear-gradient(135deg, #FFFFFF, #E0F0FF); }
  .pb-en .pb-title { color: #4FA3E0; }
  .pb-cn { border-color: #FFB8B8; background: linear-gradient(135deg, #FFFFFF, #FFE4E4); }
  .pb-cn .pb-title { color: #D63A3A; }
  .pb-color { border-color: #FFD9B8; background: linear-gradient(135deg, #FFFFFF, #FFEEDD); }
  .pb-color .pb-title { color: #E67E22; }
  .pb-lo { border-color: #C8E6C9; background: linear-gradient(135deg, #FFFFFF, #E8F5E9); }
  .pb-lo .pb-title { color: #43A047; }
  .pb-exam { border-color: #FFD966; background: linear-gradient(135deg, #FFFFFF, #FFF4CC); }
  .pb-exam .pb-title { color: #D49B00; }
  .pb-exam::after {
    content: "ໃໝ່!";
    position: absolute;
    top: -8px; right: -8px;
    background: #FF5C5C; color: #fff;
    font-size: clamp(10px,2.5vw,12px);
    font-weight: 900;
    padding: 4px 10px;
    border-radius: 999px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
    animation: wiggle 1.6s infinite;
  }

  /* ປຸ່ມໃໝ່: ນັດໝາຍອ້າຍບິກ */
  .pb-big { border-color: #FBBF24; background: linear-gradient(135deg, #FFFFFF, #FFFBEB); }
  .pb-big .pb-title { color: #B45309; }
  .pb-big::after {
    content: "HOT 🔥";
    position: absolute;
    top: -8px; right: -8px;
    background: #F97316; color: #fff;
    font-size: clamp(10px,2.5vw,12px);
    font-weight: 900;
    padding: 4px 10px;
    border-radius: 999px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
    animation: wiggle 1.6s infinite;
  }

  @keyframes wiggle {
    0%,100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }
  .picker-foot {
    margin-top: clamp(16px,3vw,24px);
    font-size: clamp(11px,2.8vw,13px);
    color: #7B6F9A; font-weight: 700;
    text-align: center;
  }
  .picker-foot strong { color: #7C6FCD; }
</style>
</head>
<body>

<div class="picker">
  <div class="picker-icon">🎒</div>
  <div class="picker-title">ມາຮຽນມ່ວນໆກັນເດີ!</div>
  <div class="picker-sub">ເລືອກວິຊາທີ່ຢາກຮຽນເລີຍ ✨</div>

  <div class="picker-grid">

    <!-- ປຸ່ມໃໝ່ ນັດໝາຍອ້າຍບິກ -->
    <a class="picker-btn pb-big" href="big.html">
      <span class="pb-icon">📅</span>
      <span class="pb-title">ນັດໝາຍອ້າຍບິກ</span>
      <span class="pb-desc">ຕາຕະລາງ &amp; ກິດຈະກຳ</span>
    </a>

    <a class="picker-btn pb-exam" href="kiemseng5.2026.html">
      <span class="pb-icon">📝</span>
      <span class="pb-title">ທວນຄືນບົດຮຽນ</span>
      <span class="pb-desc">ກຽມເສັງເດືອນ 5 ປີ 2026</span>
    </a>
    <a class="picker-btn pb-math" href="math.html">
      <span class="pb-icon">🧮</span>
      <span class="pb-title">ຄະນິດສາດ</span>
      <span class="pb-desc">ບວກ ລົບ ຄູນ ຫານ</span>
    </a>
    <a class="picker-btn pb-en" href="english.html">
      <span class="pb-icon">🅰️</span>
      <span class="pb-title">ພາສາອັງກິດ</span>
      <span class="pb-desc">A B C ມ່ວນໆ</span>
    </a>
    <a class="picker-btn pb-cn" href="chinese.html">
      <span class="pb-icon">🀄</span>
      <span class="pb-title">ພາສາຈີນ</span>
      <span class="pb-desc">ຮຽນພິນອິນ</span>
    </a>
    <a class="picker-btn pb-lo" href="hienkhien.html">
      <span class="pb-icon">🇱🇦</span>
      <span class="pb-title">ຮຽນຂຽນລາວ</span>
      <span class="pb-desc">ພະຍັນຊະນະ ສະຫຼະ</span>
    </a>
    <a class="picker-btn pb-color" href="labaiyc.html">
      <span class="pb-icon">🎨</span>
      <span class="pb-title">ລະບາຍສີ</span>
      <span class="pb-desc">ສ້າງສັນ ສະບາຍ</span>
    </a>
  </div>

  <div class="picker-foot">
    🌈 <strong>DeDyDeMy</strong> ຮຽນມ່ວນໆ ໄປກັບໝູ່ 🌈
  </div>
</div>

<script>
  window.addEventListener('message', function(e){
    var d = e.data || {};
    if(d.type === 'switchView' && d.view){
      window.location.href = d.view + '.html';
    }
  });
</script>
</body>
</html>
